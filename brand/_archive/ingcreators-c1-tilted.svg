<!--
  C1 — "tilted" differentiation variant.
    Starting from the "centered" composition, rotate the whole glyph
    8° clockwise around the triangle's centroid (24, 25).
    Effect: the equilateral triangle "leans forward" (right = reading
    direction in LTR scripts = progress / momentum).
    Minimal geometry change, maximum dynamism. Still left-right balanced
    overall because the tilt angle is small.
  Color grammar unchanged (top=blue, left=green, right=purple).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="10" fill="#0f1730"/>
  <g transform="rotate(8 24 25)">
    <!-- Shared apex: i-tittle + triangle apex -->
    <circle cx="24" cy="11" r="3.5" fill="#7c9cff"/>
    <!-- Short i stem, tilts with the composition -->
    <path d="M24 18 V25" stroke="#7c9cff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Base creators -->
    <circle cx="12" cy="32" r="3.5" fill="#7ef0c5"/>
    <circle cx="36" cy="32" r="3.5" fill="#b391ff"/>
  </g>
</svg>
