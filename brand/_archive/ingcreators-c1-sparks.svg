<!--
  C1 Option 3 — "i" + scattered sparks.
  Metaphor: foundational "i" with creative bursts emerging in free,
  asymmetric placement. Conveys creative chaos, spontaneity, playfulness.
  Fits a brand whose identity is "fresh ideas, many directions".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="10" fill="#0f1730"/>

  <!-- "i" — blue primary -->
  <circle cx="13" cy="10" r="2.5" fill="#7c9cff"/>
  <path d="M13 16 V38" stroke="#7c9cff" stroke-width="4" stroke-linecap="round"/>

  <!-- Sparks — asymmetric scatter -->
  <circle cx="26" cy="16" r="2.5" fill="#7ef0c5"/>
  <circle cx="37" cy="22" r="2.5" fill="#b391ff"/>
  <circle cx="30" cy="34" r="2.5" fill="#7c9cff"/>
</svg>
