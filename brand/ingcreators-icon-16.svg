<!--
  ingcreators 16px-optimized variant — for favicons and small UI.

  Stripped down from orbit-hierarchy so the brand's essential silhouette
  (one large anchor + two smaller orbiting dots) survives 16px rendering.

  Removed at small size:
    • i-stem       (sw=3.5 → 1.17px at 16px, blurs, reads as noise)
    • orbit arc    (sw=1 at 14% opacity → invisible below ~32px)

  Kept + amplified:
    • Apex dot     r=4.5 → r=6  (2.0 px at 16px — clearly visible)
    • Base dots    r=3.0 → r=4  (1.33 px at 16px — readable as dots)
    • Orbit asymmetry preserved (left lower-outward, right upper-inward)
      so the favicon reads as the same brand, not a generic 3-dot mark.

  Geometry (48×48 viewBox):
    Apex   (24, 14)  r=6  blue
    Left   (10, 36)  r=4  green   — trailing, outward
    Right  (38, 30)  r=4  purple  — leading, inward

  Use at 16/20/24 px. At 32 px and above, use the full
  ingcreators-c1-orbit-hierarchy.svg (includes stem + arc).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="10" fill="#0f1730"/>

  <!-- Anchor creator — enlarged for favicon legibility -->
  <circle cx="24" cy="14" r="6" fill="#7c9cff"/>

  <!-- Orbiting creators — enlarged, asymmetric -->
  <circle cx="10" cy="36" r="4" fill="#7ef0c5"/>    <!-- trailing -->
  <circle cx="38" cy="30" r="4" fill="#b391ff"/>    <!-- leading  -->
</svg>
