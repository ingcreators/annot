[package]
name = "annot-win-clipboard"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "napi-rs addon: atomic multi-format Win32 clipboard write for Annot's Office paste fallback (CF_DIB + Art::GVML ClipFormat)."
repository = "https://github.com/ingcreators/annot"

[lib]
crate-type = ["cdylib"]

# Versions are pinned EXACTLY (`=x.y.z`) on purpose. The pre-built
# `.node` binary is committed to the repo and CI re-builds + diffs
# against it (see `scripts/verify-addon.sh`); transitive drift would
# break the byte-equivalence gate.
[dependencies]
napi = { version = "=3.8.6", default-features = false, features = ["napi6"] }
napi-derive = "=3.5.5"
windows = { version = "=0.62.2", features = [
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Foundation",
] }

[build-dependencies]
napi-build = "=2.3.1"

# Reproducible release profile: optimize for size, single codegen
# unit, strip debug symbols, abort on panic. The binary stays as
# small + as deterministic as possible for the verify-build
# supply-chain gate.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
