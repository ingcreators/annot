<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annot Browse</title>
  <!--
    Browse window chrome — Phase 6 of `desktop-electron-migration.md`.
    Hosts an address bar + capture toolbar above an Electron `<webview>`
    that loads the user-navigated URL. The visible-capture path round-
    trips through `browse.captureVisible` IPC on the main process.

    Phase 6 deliberately ships a single-tab visible-only surface; the
    multi-tab orchestration + the area / full-page / per-page / click /
    hotkey modes are deferred behind the `@ingcreators/annot-capture`
    package extraction queued in `desktop-browser-mode.md` Phase 1.
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; }
    body {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      font: 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #1f2024;
      color: #f3f4f6;
    }

    /* Tab bar — Phase 5 of `desktop-browser-mode.md`. Sits between
       the toolbar and the embedded `<webview>` host; renders one
       button per tab plus a trailing "+" new-tab affordance. The
       active tab gets a subtle accent border. */
    #browse-tabs {
      display: flex;
      gap: 2px;
      padding: 4px 4px 0 4px;
      background: #2b2d33;
      border-bottom: 1px solid #3b3e46;
      align-items: flex-end;
      overflow-x: auto;
    }
    .browse-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 240px;
      min-width: 120px;
      padding: 6px 4px 6px 10px;
      background: #1f2024;
      border: 1px solid #3b3e46;
      border-bottom: 1px solid transparent;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      color: #d1d5db;
      font-size: 12px;
      white-space: nowrap;
    }
    .browse-tab .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .browse-tab .tab-close {
      background: transparent;
      color: #9ca3af;
      border: 0;
      padding: 0 6px;
      font: inherit;
      cursor: pointer;
      border-radius: 50%;
    }
    .browse-tab .tab-close:hover { background: #3b3e46; color: #f3f4f6; }
    .browse-tab.tab-active {
      background: #2b2d33;
      color: #f3f4f6;
      border-color: #4a4e58;
      border-bottom-color: #2b2d33;
    }
    .browse-tab.tab-locked { opacity: 0.6; cursor: not-allowed; }
    .browse-tab.tab-locked .tab-close { cursor: not-allowed; }
    #btn-new-tab {
      background: transparent;
      color: #9ca3af;
      border: 0;
      padding: 6px 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    #btn-new-tab:hover { background: #3b3e46; color: #f3f4f6; }
    #btn-new-tab:disabled { cursor: not-allowed; opacity: 0.5; }

    #browse-toolbar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #2b2d33;
      border-bottom: 1px solid #3b3e46;
      align-items: center;
    }
    .nav-btn, .capture-btn {
      background: #3b3e46;
      color: #f3f4f6;
      border: 1px solid #4a4e58;
      border-radius: 4px;
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
    }
    .nav-btn:hover, .capture-btn:hover { background: #4a4e58; }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #browse-url {
      flex: 1;
      background: #1f2024;
      color: #f3f4f6;
      border: 1px solid #4a4e58;
      border-radius: 4px;
      padding: 4px 10px;
      font: inherit;
    }
    #browse-url:focus { outline: 2px solid #4f9aff; }
    .capture-btn {
      background: #4f9aff;
      border-color: #4f9aff;
      color: #fff;
      font-weight: 500;
    }
    .capture-btn:hover { background: #6aaaff; }
    .capture-btn:disabled { background: #4a4e58; border-color: #4a4e58; }
    /* Click + Hotkey buttons toggle: when active, they switch from
       the capture-btn blue to a recording red so the user has an
       always-visible "we are recording" cue in the toolbar.  */
    .capture-btn.recording {
      background: #ef4444;
      border-color: #ef4444;
    }
    .capture-btn.recording:hover { background: #f76262; }

    /* In-app context menu — overlays on top of the webview when the
       user right-clicks. Replaces the OS-native page menu (the
       preload preventDefaults the contextmenu event); the menu
       offers the same six modes the toolbar exposes. */
    #annot-context-menu {
      position: fixed;
      background: #2b2d33;
      border: 1px solid #3b3e46;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      padding: 4px 0;
      min-width: 200px;
      z-index: 10000;
      display: none;
    }
    #annot-context-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: #f3f4f6;
      border: 0;
      padding: 6px 14px;
      font: inherit;
      cursor: pointer;
    }
    #annot-context-menu button:hover { background: #3b3e46; }

    /* Capture-settings modal (Phase 6). The native `<dialog>`
       element handles backdrop + Escape-to-close; we just style
       the chrome around the embedded `<annot-capture-settings>`
       element. */
    .capture-settings-dialog {
      max-width: 600px;
      width: 90vw;
      max-height: 85vh;
      padding: 0;
      background: #0b1020;
      color: #e7ecf7;
      border: 1px solid #1f2746;
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }
    .capture-settings-dialog::backdrop {
      background: rgba(0, 0, 0, 0.55);
    }
    .capture-settings-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #1f2746;
      position: sticky;
      top: 0;
      background: inherit;
      z-index: 1;
    }
    .capture-settings-header h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    .capture-settings-header .nav-btn {
      margin-left: auto;
      background: transparent;
      border: 0;
      color: #9ca3af;
      font-size: 18px;
      padding: 0 8px;
      cursor: pointer;
    }
    .capture-settings-header .nav-btn:hover { color: #f3f4f6; }
    #capture-settings-body {
      padding: 16px;
      overflow-y: auto;
      max-height: calc(85vh - 60px);
    }

    #browse-target-host {
      position: relative;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    /* Per-tab webview elements — TabsManager appends them here.
       Only the active tab has `display: block` so background tabs
       render off-screen invisibly. */
    .browse-webview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #browse-status {
      padding: 4px 12px;
      background: #2b2d33;
      border-top: 1px solid #3b3e46;
      font-size: 12px;
      color: #9ca3af;
      min-height: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #browse-status .indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
    }
    #browse-status.busy .indicator { background: #4f9aff; }
    #browse-status.error .indicator { background: #ef4444; }
    #browse-status.success .indicator { background: #10b981; }
  </style>
</head>
<body>
  <div id="browse-toolbar">
    <button id="btn-back" class="nav-btn" title="Back" aria-label="Back">←</button>
    <button id="btn-forward" class="nav-btn" title="Forward" aria-label="Forward">→</button>
    <button id="btn-reload" class="nav-btn" title="Reload" aria-label="Reload">⟳</button>
    <input id="browse-url" type="text" placeholder="Enter URL and press Enter" autocomplete="off" spellcheck="false">
    <button id="btn-capture-visible" class="capture-btn" title="Capture visible viewport (saves to Inbox)">📷 Visible</button>
    <button id="btn-capture-area" class="capture-btn" title="Capture a drag-selected area (saves to Inbox)">⬚ Area</button>
    <button id="btn-capture-full" class="capture-btn" title="Scroll-stitch the entire page into one image (saves to Inbox)">📄 Full Page</button>
    <button id="btn-capture-pages" class="capture-btn" title="Capture each viewport as a separate image (saves to Inbox)">🗒 Per Page</button>
    <button id="btn-capture-click" class="capture-btn" title="Click capture: save a capture on every click. Click again to stop.">🖱 Click ▶</button>
    <button id="btn-capture-hotkey" class="capture-btn" title="Hotkey capture: Alt+Shift+C takes a single shot. Click to start a session, click again to stop.">⌨ Hotkey ▶</button>
    <button id="btn-settings" class="nav-btn" title="Capture settings (overlays, timing, format, emulation)" aria-label="Settings">⚙</button>
  </div>
  <!-- Right-click capture menu (Phase 4B). Hidden by default;
       browse.ts positions + reveals it when the preload posts a
       `context-menu-request` event from the embedded webview. -->
  <div id="annot-context-menu" role="menu" aria-hidden="true">
    <button data-mode="visible" type="button">📷 Capture Visible</button>
    <button data-mode="area" type="button">⬚ Capture Area</button>
    <button data-mode="full" type="button">📄 Capture Full Page</button>
    <button data-mode="pages" type="button">🗒 Capture Per Page</button>
    <button data-mode="click" type="button">🖱 Toggle Click Capture</button>
    <button data-mode="hotkey" type="button">⌨ Toggle Hotkey Capture</button>
  </div>
  <!-- Capture-settings dialog (Phase 6). The `<dialog>` element
       handles modal visibility + Escape-to-close natively. The
       `<annot-capture-settings>` Lit element renders the form
       body; browse.ts wires open/close + autosave. -->
  <dialog id="capture-settings-dialog" class="capture-settings-dialog">
    <header class="capture-settings-header">
      <h2>Capture settings</h2>
      <button id="btn-settings-close" class="nav-btn" type="button" title="Close" aria-label="Close">×</button>
    </header>
    <div id="capture-settings-body"></div>
  </dialog>
  <!-- Tab bar (Phase 5). TabsManager owns the per-tab buttons +
       close affordances; the trailing "+" button is rendered here
       so its position is HTML-controlled. -->
  <div id="browse-tabs" role="tablist">
    <button id="btn-new-tab" type="button" title="New tab" aria-label="New tab">+</button>
  </div>
  <div id="browse-target-host"></div>
  <div id="browse-status">
    <span class="indicator" aria-hidden="true"></span>
    <span id="browse-status-text">Ready</span>
  </div>
  <script type="module" src="./src/browse/browse.ts"></script>
</body>
</html>
