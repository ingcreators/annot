<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annot by ingcreators</title>
  <!--
    CSS is imported from `src/app/app.ts` (mirroring the PWA's
    `packages/web/src/main.ts` pattern + the VSCode webview entry).
    Vite resolves the workspace-package paths
    (`@ingcreators/annot-core/styles/*`,
    `@ingcreators/annot-web/styles/*`) at build time. Don't add
    `<link>` tags here — the relative paths don't survive the
    `dist-electron/renderer/` build output and would 404 silently.
  -->
</head>
<body>
  <div id="app-root">
    <!--
      Editor view (shown when editing). Mirrors the PWA's editor-mode
      layout: vertical tool strip on the left (`#editor-sidebar` from
      `@ingcreators/annot-core/styles/editor.css`), canvas in the
      middle, statusbar at the bottom.

      The PWA also has an `<div id="editor-header">` at the top
      carrying brand + breadcrumb + save/copy + theme. The desktop
      omits it because the native window menu (File / Edit / View /
      Window) plus the per-tool save / theme buttons already inside
      the vertical toolbar (showSaveGroup + showThemeToggle on the
      Toolbar options) cover those actions. `app.css` overrides
      `top: 0` on the sidebar + canvas to reclaim the 48px the PWA
      reserves for editor-header.
    -->
    <div id="editor-view" style="display:none;">
      <div id="editor-sidebar"></div>
      <div id="canvas-container">
        <svg id="svg-root" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
      </div>
      <div id="statusbar">
        <button id="btn-back" class="status-btn">&larr; Back</button>
        <div id="zoom-controls">
          <button id="btn-zoom-out" class="zoom-btn"
            ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M200-450v-60h560v60H200Z"/></svg></button>
          <div class="zoom-select-wrap">
            <button id="btn-zoom-label" class="zoom-label">100%</button>
            <div id="zoom-menu" class="zoom-menu" style="display:none;"></div>
          </div>
          <button id="btn-zoom-in" class="zoom-btn"
            ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M450-450H200v-60h250v-250h60v250h250v60H510v250h-60v-250Z"/></svg></button>
        </div>
        <span id="status-size"></span>
        <span class="toolbar-spacer"></span>
        <span id="status-tool">Select</span>
      </div>
    </div>

    <!--
      Gallery view: the unified `<annot-file-manager-shell>` +
      `<annot-sidebar>` from `@ingcreators/annot-web/gallery`,
      mounted by `bootstrap.ts` against `DesktopStore`. Phase 5 of
      `docs/plans/_done/desktop-storage-provider-migration.md`
      deleted the bespoke SQLite-backed `#gallery-view` that
      previously sat alongside this container; a follow-up landed
      `getNewMenuExtras?` on `<annot-sidebar>`'s callbacks so the
      desktop's Window / Region capture + Open Browse Window now
      surface inside the unified New menu instead of a separate
      `<div class="desktop-fs-action-row">` chrome above.

      The inner `#file-manager` / `#sidebar` / `#main-content` ids
      mirror the PWA's `packages/web/index.html`. file-manager.css
      from `@ingcreators/annot-web` scopes most of its rules under
      those ids; renaming them in the desktop host would silently
      drop the styling. The `#desktop-shell` wrapper carries the
      flex column the `#file-manager` override depends on plus the
      gallery's surface background; it's also the show/hide target
      `bootstrap.ts` toggles when the editor takes over.
    -->
    <div id="desktop-shell" style="display:none;">
      <div id="file-manager">
        <div id="sidebar"></div>
        <div id="main-content"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/app/app.ts"></script>
</body>
</html>
