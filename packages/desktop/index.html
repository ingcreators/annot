<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annot by ingcreators</title>
  <link rel="stylesheet" href="./src/styles/editor.css">
  <link rel="stylesheet" href="./src/styles/toolbar.css">
  <link rel="stylesheet" href="./src/styles/property-panel.css">
  <link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
  <div id="app-root">
    <!-- Editor view (shown when editing) -->
    <div id="editor-view" style="display:none;">
      <div id="toolbar"></div>
      <div id="canvas-container">
        <svg id="svg-root" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
      </div>
      <div id="statusbar">
        <button id="btn-back" class="status-btn">&larr; Back</button>
        <div id="zoom-controls">
          <button id="btn-zoom-out" class="zoom-btn"
            ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M200-450v-60h560v60H200Z"/></svg></button>
          <div class="zoom-select-wrap">
            <button id="btn-zoom-label" class="zoom-label">100%</button>
            <div id="zoom-menu" class="zoom-menu" style="display:none;"></div>
          </div>
          <button id="btn-zoom-in" class="zoom-btn"
            ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M450-450H200v-60h250v-250h60v250h250v60H510v250h-60v-250Z"/></svg></button>
        </div>
        <span id="status-size"></span>
        <span class="toolbar-spacer"></span>
        <span id="status-tool">Select</span>
      </div>
    </div>

    <!-- Welcome / Gallery view (shown by default) -->
    <div id="gallery-view">
      <div class="gallery-header">
        <h1 class="app-title">Annot</h1>
        <div class="gallery-actions">
          <button id="btn-capture-screen" class="action-btn action-btn-primary">Capture Screen</button>
          <button id="btn-capture-window" class="action-btn action-btn-primary">Capture Window</button>
          <button id="btn-capture-region" class="action-btn action-btn-primary">Capture Region</button>
          <button id="btn-open-image" class="action-btn">Open Image</button>
          <button id="btn-paste-image" class="action-btn">Paste from Clipboard</button>
        </div>
      </div>
      <div id="gallery-grid" class="gallery-grid">
        <div class="gallery-empty">
          <p>No screenshots yet.</p>
          <p>Use the Chrome extension to capture, or open an image file.</p>
        </div>
      </div>
    </div>

    <!--
      Phase 2 of `docs/plans/desktop-storage-provider-migration.md`:
      host DOM for the unified `<annot-file-manager-shell>` +
      `<annot-sidebar>` mounted by `bootstrap.ts` when
      `localStorage.annotDesktopStorageMode === "fs"`. Hidden by
      default (the bootstrap toggles it visible after construction);
      Phase 4 default-flips, Phase 5 deletes the bespoke
      `#gallery-view` above and the `display:none` here.
    -->
    <div id="desktop-fs-gallery" style="display:none;">
      <div class="desktop-fs-action-row">
        <!--
          Window / Region capture stay outside the unified "New"
          menu for the first cycle (per Phase 0 audit gap #1) until
          a `getNewMenuExtras?` host hook lands on `<annot-sidebar>`.
        -->
        <button id="btn-fs-capture-window" class="action-btn action-btn-primary">Capture Window</button>
        <button id="btn-fs-capture-region" class="action-btn action-btn-primary">Capture Region</button>
        <span class="desktop-fs-action-spacer"></span>
        <!--
          Phase 4 settings entry point — opens the rollback dialog
          that lets the user revert to the SQLite-backed bespoke
          gallery for one release cycle. Phase 5 deletes the button
          + dialog along with the legacy codepath.
        -->
        <button id="btn-fs-settings" class="action-btn">Settings</button>
      </div>
      <div class="desktop-fs-gallery-body">
        <div id="desktop-fs-sidebar" class="desktop-fs-sidebar"></div>
        <div id="desktop-fs-main-content" class="desktop-fs-main-content"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/app/app.ts"></script>
</body>
</html>
