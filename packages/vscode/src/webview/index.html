<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annot</title>
    <style>
      :root {
        --annot-bg-canvas: var(--vscode-editor-background, #1e1e1e);
        --annot-text-primary: var(--vscode-editor-foreground, #ddd);
        --annot-border-color: var(--vscode-panel-border, #444);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--annot-bg-canvas);
        color: var(--annot-text-primary);
        font: 13px/1.5 var(--vscode-editor-font-family, system-ui);
      }
      /*
       * Three-pane layout: left toolbar (vertical strip) │
       * center canvas (scroll) │ right property-panel.
       * Mirrors the PWA's Draw.io / Figma pattern but stripped
       * of the editor-header + statusbar (VSCode supplies the
       * tab title + status bar item itself).
       */
      #annot-shell-root {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: 1fr;
      }
      #annot-shell-toolbar {
        grid-column: 1;
        overflow: hidden;
      }
      #annot-shell-container {
        grid-column: 2;
        overflow: auto;
        position: relative;
      }
      #annot-shell-right-panel {
        grid-column: 3;
        overflow: auto;
      }
      .annot-placeholder {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="annot-shell-root">
      <div id="annot-shell-toolbar"></div>
      <div id="annot-shell-container">
        <div class="annot-placeholder">Loading Annot editor…</div>
      </div>
      <div id="annot-shell-right-panel"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
