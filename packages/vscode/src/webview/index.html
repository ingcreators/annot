<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annot</title>
    <style>
      /*
       * Pre-script paint: use VSCode's own variables directly
       * so the iframe shows the right background even before
       * the bundled `main.ts` runs and the EditorShell
       * applies the full `--annot-*` token mapping. The mapped
       * `--annot-*` tokens take over once the script boots.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--vscode-editor-background);
        color: var(--vscode-foreground);
        font: 13px/1.5 var(--vscode-editor-font-family, system-ui);
      }
      /*
       * Layout: left toolbar (vertical strip) │ centre column
       * (canvas on top + statusbar at the bottom) │ right
       * property-panel. Mirrors the PWA's Draw.io / Figma
       * pattern but stripped of the editor-header (VSCode
       * supplies the tab title itself).
       *
       * `min-width: 0` / `min-height: 0` on every grid item is
       * required so children that exceed the cell size (e.g.
       * the canvas SVG at 200% zoom) get clipped instead of
       * pushing the cell wider/taller. Without these, the
       * grid item's default `min-*: auto` pins the cell to
       * the intrinsic content size and `overflow: auto` on
       * the inner container never kicks in.
       */
      #annot-shell-root {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: 1fr;
        min-width: 0;
        min-height: 0;
      }
      /*
       * Pane separators — explicit 1px lines between toolbar /
       * canvas / right-panel / statusbar. Without these, the
       * VSCode-mapped surface tokens (sideBar-background ≈
       * editor-background in many themes) leave the panes
       * visually fused: in Default Dark+ the difference is one
       * shade (`#252526` vs `#1e1e1e`), barely perceptible.
       * `--vscode-panel-border` is the workbench's canonical
       * inter-pane separator colour and stays visible across
       * Light / Dark / High Contrast.
       */
      #annot-shell-toolbar {
        grid-column: 1;
        /*
         * Explicit 48 px width + flex-center to match the PWA's
         * `#editor-sidebar { width: 48px; align-items: center; }`
         * surround. Without this, the cell auto-sizes to the
         * 36 px buttons exactly — the variant badges (12 px
         * circles anchored at `right: -2px; bottom: -2px;` per
         * `.tool-btn-badge`) end up flush with the right edge
         * with zero breathing room. The 6 px on each side
         * mirrors the PWA's button-vs-strip gutter.
         */
        width: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        /*
         * `overflow: visible` (both axes) so the badges +
         * tooltip bubbles can extend past the strip without
         * getting clipped. Mirrors the PWA's `#editor-sidebar
         * { overflow: visible }` rule. Per CSS spec, mixing
         * `overflow-x: visible` with `overflow-y: auto`
         * promotes `visible` to `auto` and re-introduces
         * clipping, so we stay fully visible.
         */
        overflow: visible;
        min-height: 0;
        border-right: 1px solid
          var(--vscode-panel-border, var(--vscode-contrastBorder, transparent));
      }
      #annot-shell-centre {
        grid-column: 2;
        display: grid;
        grid-template-rows: 1fr auto;
        min-width: 0;
        min-height: 0;
      }
      #annot-shell-container {
        overflow: auto;
        position: relative;
        min-width: 0;
        min-height: 0;
      }
      #annot-shell-statusbar {
        border-top: 1px solid
          var(--vscode-panel-border, var(--vscode-contrastBorder, transparent));
      }
      #annot-shell-right-panel {
        grid-column: 3;
        overflow: auto;
        min-height: 0;
        border-left: 1px solid
          var(--vscode-panel-border, var(--vscode-contrastBorder, transparent));
      }
      .annot-placeholder {
        padding: 24px;
      }

      /*
       * VSCode-specific contrast overrides — DARK-BACKGROUND
       * active states only.
       *
       * `core/styles/toolbar.css` + `property-panel.css` paint
       * `color: var(--annot-accent)` on every `.active` chip. In
       * our token map `--annot-accent` resolves to
       * `--vscode-button-background` (blue). The surfaces below
       * resolve their active background via
       * `--annot-choice-active` → `--vscode-list-activeSelectionBackground`
       * (also blue), so the glyph disappears against the chip —
       * switch the foreground to
       * `--vscode-list-activeSelectionForeground` (workbench
       * canonical "text over active selection", ≥ 4.5:1).
       *
       *   .toolbar-btn.active                          — bg = --annot-active-bg     (list-activeSelectionBackground)
       *   .toolbar-btn.active .tool-btn-badge,
       *   .toolbar-btn.active .tool-btn-badge-svg > svg
       *                                                — bg = --annot-active-bg     (badge blends with the active button)
       *   .prop-choice-item.active .prop-choice-label  — bg = --annot-choice-active (list-activeSelectionBackground)
       *
       * Filled-accent surfaces — bg = --annot-accent
       * (--vscode-button-background); paired with
       * `--vscode-button-foreground` (a separate rule below) so the
       * workbench's button contrast budget applies:
       *
       *   .tool-flyout-chip.active                     — bg = --annot-accent (button-background)
       *   .tool-flyout-chip-svg.active                 — bg = --annot-accent (button-background)
       *   .prop-choice-chip.active                     — bg = --annot-accent (button-background)
       *
       * NOT covered (deliberately):
       *
       *   `.tool-flyout-color-chip.active` — no glyph; the
       *   visible swatch is the `::before` rounded square
       *   showing `--swatch-color`. The frame's blue border is
       *   what conveys "active"; foreground colour on the chip
       *   itself is irrelevant.
       *
       *   `.pp-select-item.active` — uses
       *   `--annot-choice-hover` (LIGHT hover tint, not the
       *   active selection blue). The original
       *   `color: var(--annot-accent)` blue on the light hover
       *   tint has fine contrast; an early iteration of this
       *   override over-reached onto it and made the row
       *   illegible (see #430).
       *
       * The leading `html` prefix bumps specificity from (0,2,0)
       * to (0,2,1) so this rule beats `toolbar.css` /
       * `property-panel.css`'s own `.foo.active { color:
       * var(--annot-accent) }`. Without the bump the rules tie
       * on specificity and the imported stylesheet wins on
       * source order — Vite injects imported CSS into `<head>`
       * AFTER this inline `<style>`, so the override silently
       * loses (verified in #426 post-mortem).
       */
      /* Surfaces with bg = `--vscode-list-activeSelectionBackground`
       * (paired with list-activeSelectionForeground in workbench
       * themes for ≥ 4.5:1 contrast). */
      html .toolbar-btn.active,
      html .prop-choice-item.active .prop-choice-label,
      html .toolbar-btn.active .tool-btn-badge {
        color: var(
          --vscode-list-activeSelectionForeground,
          var(--vscode-foreground)
        );
      }
      /* Filled-accent surfaces (bg = `--annot-accent` =
       * `--vscode-button-background` after the *.css refactors
       * that made active chips solid filled tiles — flyout chips
       * in #434, prop-choice chip in the follow-up that ships
       * alongside this override edit). VSCode themes pair
       * button-background with button-foreground; using the
       * matching token guarantees the contrast budget the
       * workbench designer chose for the theme. */
      html .tool-flyout-chip.active,
      html .tool-flyout-chip-svg.active,
      html .prop-choice-chip.active {
        color: var(
          --vscode-button-foreground,
          var(--vscode-list-activeSelectionForeground, var(--vscode-foreground))
        );
      }
      /* SVG-glyph variant of the badge: the inline SVG inherits the
       * badge's `color` for `currentColor` strokes, but its own rule
       * (`.tool-btn-badge-svg > svg { color: var(--annot-accent) }`)
       * resets it back to blue. Bump specificity here too so the
       * white-on-blue contrast holds for arrow / rect / counter SVG
       * badges as well. */
      html .toolbar-btn.active .tool-btn-badge-svg > svg {
        color: var(
          --vscode-list-activeSelectionForeground,
          var(--vscode-foreground)
        );
      }

      /* WCAG-driven contrast fixes for surfaces where
       * `--annot-accent` (= `--vscode-button-background`, a dim
       * `#0E639C` in Dark+) lands on a low-contrast partner.
       * Every selector below paints a glyph / icon in
       * `--annot-accent` on hover or in the inactive badge state.
       * Listed with the actual Dark+ contrast ratio it produces:
       *
       *   .tool-btn-badge                              — bg `#252526` → `#0E639C` ≈ 2.57:1 ❌
       *   .tool-btn-badge-svg > svg                    — same          ≈ 2.57:1 ❌
       *   .tool-flyout-chip:hover                      — bg `#494B4C` → `#0E639C` ≈ 1.23:1 ❌
       *   .tool-flyout-chip-svg:hover                  — same          ≈ 1.23:1 ❌
       *   .prop-choice-chip:hover                      — bg `#363637` → `#0E639C` ≈ 1.99:1 ❌
       *   .prop-btn:hover                              — bg `#4D4D4D` → `#0E639C` ≈ 1.36:1 ❌
       *   .pp-number-spinner button:hover              — bg ~panel    → `#0E639C` ≈ 2.0:1 ❌
       *
       * Switching the glyph to `--vscode-foreground` (`#CCCCCC`
       * in Dark+) lifts every one well past AA's 3:1 minimum for
       * non-text UI components. Light+ + High Contrast themes
       * paint a brighter foreground so ratios only go up.
       *
       * Bg / border / outline rings stay `--annot-accent` so the
       * "variant indicator / hover affordance" semantics still
       * read — only the glyph itself gets neutralised so it
       * actually has contrast to read on the dim button-bg. */
      /* biome-ignore lint/style/noDescendingSpecificity: the leading
         `html ` is a deliberate specificity bump so this a11y contrast
         override wins over the base `.tool-btn-badge*` glyph colour;
         lowering it would regress the documented WCAG fix above. */
      html .tool-btn-badge,
      /* biome-ignore lint/style/noDescendingSpecificity: same deliberate
         `html ` specificity bump as above, per-selector suppression. */
      html .tool-btn-badge-svg > svg,
      html .tool-flyout-chip:hover:not(.active),
      html .tool-flyout-chip-svg:hover:not(.active),
      html .prop-choice-chip:hover:not(.active),
      html .prop-btn:hover,
      html .pp-number-spinner button:hover {
        /* `:not(.active)` on the chip selectors keeps the
         * filled-active styling (button-background +
         * button-foreground from the rules above) intact when
         * the user hovers the currently-active chip — without it
         * the same-specificity hover rule wins on source order
         * and the active chip's glyph drops back to
         * `--vscode-foreground`, breaking the active-vs-hover
         * hierarchy momentarily. `.prop-btn` /
         * `.pp-number-spinner button` don't carry an `.active`
         * state so the hover guard is unconditional. */
        color: var(--vscode-foreground);
      }

      /* Hover ring contrast — every hover rule above paints
       * `border-color: var(--annot-accent)` (=
       * `--vscode-button-background`, `#0E639C` in Dark+). That
       * dim blue lands at 1.2-2:1 against the chip's hover bg,
       * which fails WCAG SC 1.4.11 (≥ 3:1 for non-text UI
       * components). Switching the ring to
       * `--vscode-focusBorder` (`#007FD4` in Dark+, the
       * workbench's canonical "focus ring" colour designed for
       * visibility) lifts the contrast to ≈ 3:1 — borderline AA
       * UI in isolation, but combined with the glyph-foreground
       * override above and the bg tint, the overall hover state
       * is clearly identifiable as an active state.
       *
       * Surfaces covered (visible inside the VSCode webview):
       *
       *   .tool-flyout-chip:hover                     (variant flyout)
       *   .tool-flyout-chip-svg:hover                 (variant flyout)
       *   .tool-flyout-color-chip:hover               (highlight flyout)
       *   .prop-btn:hover                             (right panel mini buttons)
       *   .prop-choice-chip:hover                     (right panel TYPE picker)
       *   .color-swatch:hover                         (palette swatch picker)
       *   .pp-select:hover                            (right panel <pp-select>)
       *   .pp-color-none-btn:hover                    (color-none button)
       *   .tag-add-btn:hover                          (file-details drawer)
       *
       * `:not(.active)` mirrors the glyph-color guard above for
       * surfaces that have an active state (chips + color
       * swatch). `.prop-btn`, `.pp-select`,
       * `.pp-color-none-btn`, `.tag-add-btn` don't carry
       * `.active`, so the hover rule applies unconditionally. */
      html .tool-flyout-chip:hover:not(.active),
      html .tool-flyout-chip-svg:hover:not(.active),
      html .tool-flyout-color-chip:hover:not(.active),
      html .prop-btn:hover,
      html .prop-choice-chip:hover:not(.active),
      html .color-swatch:hover:not(.active),
      html .pp-select:hover,
      html .pp-color-none-btn:hover,
      html .tag-add-btn:hover {
        border-color: var(--vscode-focusBorder, var(--annot-accent));
      }
    </style>
  </head>
  <body>
    <div id="annot-shell-root">
      <div id="annot-shell-toolbar"></div>
      <div id="annot-shell-centre">
        <div id="annot-shell-container">
          <div class="annot-placeholder">Loading Annot editor…</div>
        </div>
        <div id="annot-shell-statusbar"></div>
      </div>
      <div id="annot-shell-right-panel"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
