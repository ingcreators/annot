<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annot</title>
    <style>
      :root {
        --annot-bg-canvas: var(--vscode-editor-background, #1e1e1e);
        --annot-text-primary: var(--vscode-editor-foreground, #ddd);
        --annot-border-color: var(--vscode-panel-border, #444);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--annot-bg-canvas);
        color: var(--annot-text-primary);
        font: 13px/1.5 var(--vscode-editor-font-family, system-ui);
      }
      /*
       * Layout: left toolbar (vertical strip) │ centre column
       * (canvas on top + statusbar at the bottom) │ right
       * property-panel. Mirrors the PWA's Draw.io / Figma
       * pattern but stripped of the editor-header (VSCode
       * supplies the tab title itself).
       *
       * `min-width: 0` / `min-height: 0` on every grid item is
       * required so children that exceed the cell size (e.g.
       * the canvas SVG at 200% zoom) get clipped instead of
       * pushing the cell wider/taller. Without these, the
       * grid item's default `min-*: auto` pins the cell to
       * the intrinsic content size and `overflow: auto` on
       * the inner container never kicks in.
       */
      #annot-shell-root {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: 1fr;
        min-width: 0;
        min-height: 0;
      }
      #annot-shell-toolbar {
        grid-column: 1;
        overflow: hidden;
        min-height: 0;
      }
      #annot-shell-centre {
        grid-column: 2;
        display: grid;
        grid-template-rows: 1fr auto;
        min-width: 0;
        min-height: 0;
      }
      #annot-shell-container {
        overflow: auto;
        position: relative;
        min-width: 0;
        min-height: 0;
      }
      #annot-shell-statusbar {
        border-top: 1px solid var(--annot-border-color);
      }
      #annot-shell-right-panel {
        grid-column: 3;
        overflow: auto;
        min-height: 0;
      }
      .annot-placeholder {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="annot-shell-root">
      <div id="annot-shell-toolbar"></div>
      <div id="annot-shell-centre">
        <div id="annot-shell-container">
          <div class="annot-placeholder">Loading Annot editor…</div>
        </div>
        <div id="annot-shell-statusbar"></div>
      </div>
      <div id="annot-shell-right-panel"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
