<!--
  Annot stacked wordmark (inverse — for dark backgrounds).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none" role="img" aria-label="Annot by ingcreators">
  <g transform="translate(0 4)">
    <rect width="48" height="48" rx="10" fill="#0f1730"/>
    <circle cx="24" cy="7" r="3.5" fill="#7c9cff"/>
    <path d="M24 13 L13 38" stroke="#7ef0c5" stroke-width="4" stroke-linecap="round"/>
    <path d="M24 13 L35 38" stroke="#b391ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M19 24 H29" stroke="#7c9cff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <text x="62" y="30"
        fill="#eef2ff"
        font-family="Sora, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-weight="700"
        font-size="22"
        letter-spacing="-0.025em">Annot</text>

  <!--
    Secondary: org line in muted blue (brand-blue-derived), not grey.
    "by ingcreators" is rendered in the color of the ingcreators "i"
    network — an attribution stated in the network's own voice.
  -->
  <text x="62" y="46"
        fill="#9fb0dc"
        font-family="Sora, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-weight="500"
        font-size="11"
        letter-spacing="0.02em">by ingcreators</text>
</svg>
