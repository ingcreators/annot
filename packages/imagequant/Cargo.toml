[package]
name = "annot-imagequant"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "In-tree wasm-bindgen wrapper around ImageOptim/libimagequant for Annot's PNG-8 capture pipeline."
repository = "https://github.com/ingcreators/annot"

[lib]
crate-type = ["cdylib", "rlib"]

# Versions are pinned EXACTLY (`=x.y.z`) on purpose — see the supply-chain
# rationale in `docs/plans/vendor-libimagequant.md`. Bumps require a
# deliberate PR rather than transitive drift.
[dependencies]
imagequant = "=4.4.1"
wasm-bindgen = "=0.2.118"
js-sys = "=0.3.95"

# Reproducible release profile: optimize for size, single codegen unit,
# strip debug symbols, abort on panic. The output `.wasm` is committed
# to the repo so contributors and reviewers can byte-compare against a
# fresh `wasm-pack build` produced by `scripts/build-wasm.sh`.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Pass through the post-link wasm-opt flags wasm-pack invokes after
# rustc. Current rustc emits bulk-memory + reference-types + multivalue
# + nontrapping-fptoint + sign-ext instructions by default for
# wasm32-unknown-unknown; the wasm-opt that wasm-pack 0.13.1 downloads
# is old enough that it rejects them without explicit --enable flags.
# `--all-features` is the simplest forward-compatible knob — newer
# rustc may turn on more features by default and we want the build to
# keep working without churning this list.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]
