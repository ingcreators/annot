<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Annot — Settings</title>
  <link rel="stylesheet" href="../styles/options.css">
</head>
<body>
  <main class="options-root">
    <header class="options-header">
      <div class="brand">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="10" fill="#0f1730"/>
          <circle cx="24" cy="7" r="3.5" fill="#7c9cff"/>
          <path d="M24 13 L13 38" stroke="#7ef0c5" stroke-width="4" stroke-linecap="round"/>
          <path d="M24 13 L35 38" stroke="#b391ff" stroke-width="4" stroke-linecap="round"/>
          <path d="M19 24 H29" stroke="#7c9cff" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="brand-title">Annot Settings</div>
          <div class="brand-sub">by ingcreators · Advanced capture options</div>
        </div>
      </div>
      <div class="options-status" id="saved-note" aria-live="polite"></div>
    </header>

    <!-- The settings form is the shared `<annot-capture-settings>`
         Lit component from `@ingcreators/annot-host-ui`. It renders
         every section + autosaves on each input. The extension's
         options.ts wires `settings-changed` to `chrome.storage.sync`. -->
    <annot-capture-settings id="capture-settings"></annot-capture-settings>
  </main>

  <script type="module" src="./options.ts"></script>
</body>
</html>
