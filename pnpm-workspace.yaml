packages:
  - "packages/*"

allowBuilds:
  # `better-sqlite3` is a devDep of `packages/worker` used for
  # SQLite-backed unit tests against the same SQL the production
  # D1 binding runs (so user-repo tests catch syntax / constraint
  # bugs locally). Native binding with platform-matched prebuilt
  # binaries; postinstall fetches the right one.
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
  msw: true
  # `sharp` is pulled in transitively by wrangler (image asset
  # processing). Native libvips binding; needs the postinstall to
  # download the platform-matched binary.
  sharp: true
  # `workerd` is Cloudflare's V8-based Workers runtime, pulled in
  # by wrangler. The postinstall fetches the platform-matched
  # binary used by `wrangler dev` to emulate the Workers runtime
  # locally.
  workerd: true

# Centralised version pins for build-time tooling that every package
# uses. Each package keeps its own devDependency entry (so the
# `tsc` / `vite` binaries land in its `node_modules/.bin/` and the
# package-local `pnpm --filter <pkg> typecheck` / `build` scripts
# resolve them); only the version literal lives here.
#
# Add a new entry when a tool starts being declared identically by
# 3+ packages.
catalog:
  typescript: ^6.0.3
  vite: ^8.1.4

# Security-advisory overrides for transitive dependencies we don't
# control directly (kept range-scoped so a future major bump of the
# parent drops the override naturally). pnpm 11 reads overrides from
# this file — the legacy `pnpm.overrides` field in package.json was
# silently ignored, which is why it was migrated here.
overrides:
  # GHSA advisory: serialize-javascript XSS (<7.0.3)
  "serialize-javascript@<7.0.3": ">=7.0.3"
  # GHSA advisory: form-data CRLF injection (electron-builder chain)
  "form-data@>=4.0.0 <4.0.6": ">=4.0.6"
  # GHSA advisory: hono CORS middleware origin reflection
  # (@modelcontextprotocol/sdk > @hono/node-server chain resolves its
  # own hono instance, separate from the worker's direct dependency)
  "hono@<4.12.25": ">=4.12.25"
  # GHSA advisory: tmp path traversal (exceljs + electron-builder chains)
  "tmp@<0.2.6": ">=0.2.6"
  # GHSA advisories: undici WebSocket DoS / TLS bypass / SOCKS5 routing
  # (wrangler > miniflare chain)
  "undici@<6.27.0": ">=6.27.0 <7.0.0"
  "undici@>=7.0.0 <7.28.0": ">=7.28.0"
  # GHSA advisory: ws memory-exhaustion DoS (vitest + miniflare chains)
  "ws@>=8.0.0 <8.21.0": ">=8.21.0"
  # GHSA advisory: node-tar PAX size-override parser differential
  # (file smuggling)
  "tar@<7.5.16": ">=7.5.16"
  # GHSA advisory: uuid missing buffer bounds check in v3/v5/v6
  # (exceljs chain; exceljs only calls v4() without a buf, but the
  # bump is API-compatible for that call)
  "uuid@<11.1.1": ">=11.1.1 <12.0.0"
  # GHSA advisory: yaml stack overflow via deeply nested collections
  "yaml@>=2.0.0 <2.8.3": ">=2.8.3"
  # GHSA advisory: @babel/core arbitrary file read via
  # sourceMappingURL comment
  "@babel/core@<7.29.6": ">=7.29.6 <8.0.0"
  # NOTE: the vite 7.x server.fs.deny advisory (astro 6 chain) is NOT
  # overridden here — an override rewrites Storybook's / vite-plugin-dts'
  # peer ranges too. The astro 6.4.6 bump re-resolves its vite to 7.3.5.
