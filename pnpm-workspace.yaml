packages:
  - "packages/*"

allowBuilds:
  # `better-sqlite3` is a devDep of `packages/worker` used for
  # SQLite-backed unit tests against the same SQL the production
  # D1 binding runs (so user-repo tests catch syntax / constraint
  # bugs locally). Native binding with platform-matched prebuilt
  # binaries; postinstall fetches the right one.
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
  msw: true
  # `sharp` is pulled in transitively by wrangler (image asset
  # processing). Native libvips binding; needs the postinstall to
  # download the platform-matched binary.
  sharp: true
  # `workerd` is Cloudflare's V8-based Workers runtime, pulled in
  # by wrangler. The postinstall fetches the platform-matched
  # binary used by `wrangler dev` to emulate the Workers runtime
  # locally.
  workerd: true

# Centralised version pins for build-time tooling that every package
# uses. Each package keeps its own devDependency entry (so the
# `tsc` / `vite` binaries land in its `node_modules/.bin/` and the
# package-local `pnpm --filter <pkg> typecheck` / `build` scripts
# resolve them); only the version literal lives here.
#
# Add a new entry when a tool starts being declared identically by
# 3+ packages.
catalog:
  typescript: ^6.0.3
  vite: ^6.4.2
