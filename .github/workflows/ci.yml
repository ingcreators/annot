name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt JavaScript actions (checkout, setup-node, pnpm/action-setup) into
# the Node 24 runner ahead of GitHub's forced-switch on 2026-06-02.
# This only affects how those actions themselves run; the Node version
# used for our build is still set below via actions/setup-node.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Tests (vitest)
        run: pnpm test

      # The desktop electron-vite build is platform-agnostic JS
      # bundling — emits `dist-electron/{main,preload,renderer}/`.
      # The platform-specific installer packaging lives in
      # `desktop-release.yml`, which runs the matching
      # `electron-builder` invocation on a matrix of OSes.
      - name: Build (core, web, extension, desktop)
        run: >
          pnpm
          --filter @ingcreators/annot-core
          --filter @ingcreators/annot-web
          --filter @ingcreators/annot-extension
          --filter @ingcreators/annot-desktop
          build

      # Storybook build. Originally landed as `continue-on-error: true`
      # in Phase 1 of docs/plans/_done/storybook-introduction.md so the
      # team could get used to the workflow without a flaky story
      # stalling unrelated PRs. The five bootstrap stories have been
      # stable on every CI run for months, so the gate is now
      # blocking — a story that fails to build now fails the PR.
      - name: Build Storybook
        run: pnpm --filter @ingcreators/annot-web build-storybook

  # Run `pnpm audit` as a separate non-blocking job so findings surface
  # in the PR's check list without keeping the main typecheck/build
  # job waiting. `continue-on-error: true` means a new transitive
  # CVE doesn't stall merges while the team triages — GitHub's
  # native security advisory flow is our authoritative alert path,
  # and dependabot handles the actual upgrade PRs.
  security:
    name: security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high severity)
        run: pnpm audit --audit-level=high

  # Phase 2 of docs/plans/vendor-libimagequant.md: rebuild the
  # `@ingcreators/annot-imagequant` WASM artefact from source and
  # diff against the committed `packages/imagequant/pkg/`. This is
  # the supply-chain gate that Dependabot structurally cannot
  # provide — it catches unauthorised modifications to the compiled
  # blob (a contributor PR, a compromised maintainer account, a
  # typo'd commit) by failing the build when the diff is non-empty.
  #
  # Runs on every PR with aggressive Rust + wasm-pack caching so the
  # cache hit rate keeps wall time low. Path filter avoids spinning
  # up the Rust toolchain for unrelated PRs (TypeScript-only diffs);
  # changes to the workflow itself or to the imagequant package
  # both re-trigger.
  verify-wasm:
    name: verify imagequant wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `dorny/paths-filter` calls the GitHub REST API to enumerate PR
    # files; the default GITHUB_TOKEN scope is read-only metadata, so
    # without `pull-requests: read` the filter step 403s with
    # "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - name: Detect imagequant or workflow changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            imagequant:
              - 'packages/imagequant/**'
              - '.github/workflows/ci.yml'

      # The `wasm32-unknown-unknown` target ships precompiled with
      # rustup, so explicitly add it; rust-toolchain action would do
      # the same with more boilerplate.
      - name: Set up Rust + wasm32 target
        if: steps.filter.outputs.imagequant == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      # Cache cargo's registry/git/build outputs keyed on Cargo.lock
      # so subsequent runs skip the dependency compilation. The cache
      # eviction policy on GitHub-hosted runners is generous enough
      # that the steady-state hit rate stays high.
      - name: Cache cargo registry + build
        if: steps.filter.outputs.imagequant == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/imagequant/target
          key: cargo-imagequant-${{ runner.os }}-${{ hashFiles('packages/imagequant/Cargo.lock') }}
          restore-keys: |
            cargo-imagequant-${{ runner.os }}-

      - name: Cache wasm-pack binary
        if: steps.filter.outputs.imagequant == 'true'
        id: wasm-pack-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.13.1-${{ runner.os }}

      - name: Install wasm-pack
        if: steps.filter.outputs.imagequant == 'true' && steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Verify committed pkg/ matches a fresh build
        if: steps.filter.outputs.imagequant == 'true'
        env:
          VERIFY_WASM_OUT_DIR: ${{ runner.temp }}/imagequant-fresh
        run: bash packages/imagequant/scripts/verify-wasm.sh

      # On failure, expose the fresh pkg/ as a downloadable artefact
      # so the canonical Linux build can be inspected (or re-committed
      # if the diff is a legitimate platform-determinism difference
      # between the contributor's local OS and the CI Linux runner).
      - name: Upload fresh pkg/ on diff
        if: steps.filter.outputs.imagequant == 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: imagequant-fresh-pkg
          path: ${{ runner.temp }}/imagequant-fresh/pkg
          if-no-files-found: error

      - name: Skip — no imagequant or workflow changes
        if: steps.filter.outputs.imagequant != 'true'
        run: echo "No changes under packages/imagequant/ or this workflow; skipping."
