name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the auto-provisioned GITHUB_TOKEN. Jobs
# that need more (verify-wasm + verify-win-clipboard need
# `pull-requests: read` for dorny/paths-filter) declare it on the job.
# Without this top-level block the token inherits the repo/org default,
# which is read-write on older orgs — see CodeQL
# `actions/missing-workflow-permissions`.
permissions:
  contents: read

# Opt JavaScript actions (checkout, setup-node, pnpm/action-setup) into
# the Node 24 runner ahead of GitHub's forced-switch on 2026-06-02.
# This only affects how those actions themselves run; the Node version
# used for our build is still set below via actions/setup-node.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Tests (vitest)
        run: pnpm test

      # The desktop electron-vite build is platform-agnostic JS
      # bundling — emits `dist-electron/{main,preload,renderer}/`.
      # The platform-specific installer packaging lives in
      # `desktop-release.yml`, which runs the matching
      # `electron-builder` invocation on a matrix of OSes.
      # `@ingcreators/annot-docs-site` is the Astro Starlight
      # docs site. The legacy VitePress sibling was deleted in
      # the "retire VitePress + English-only" follow-up to
      # `docs/plans/_done/annot-work-astro-unification.md`.
      - name: Build (core, web, extension, desktop, marketing, docs-site)
        run: >
          pnpm
          --filter @ingcreators/annot-core
          --filter @ingcreators/annot-web
          --filter @ingcreators/annot-extension
          --filter @ingcreators/annot-desktop
          --filter @ingcreators/annot-marketing
          --filter @ingcreators/annot-docs-site
          build

      # Storybook build. Originally landed as `continue-on-error: true`
      # in Phase 1 of docs/plans/_done/storybook-introduction.md so the
      # team could get used to the workflow without a flaky story
      # stalling unrelated PRs. The five bootstrap stories have been
      # stable on every CI run for months, so the gate is now
      # blocking — a story that fails to build now fails the PR.
      - name: Build Storybook
        run: pnpm --filter @ingcreators/annot-web build-storybook

  # Run `pnpm audit` as a separate non-blocking job so findings surface
  # in the PR's check list without keeping the main typecheck/build
  # job waiting. `continue-on-error: true` means a new transitive
  # CVE doesn't stall merges while the team triages — GitHub's
  # native security advisory flow is our authoritative alert path,
  # and dependabot handles the actual upgrade PRs.
  security:
    name: security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high severity)
        run: pnpm audit --audit-level=high

  # Secret scanning with gitleaks. Blocking (no `continue-on-error`):
  # a leaked credential is a hard stop, unlike a dependency CVE which
  # needs triage time. Config lives in `.gitleaks.toml` at the repo
  # root — the small allowlist there covers known-public Cloudflare
  # resource IDs, `.env.example` placeholders, and clearly-labelled
  # worker test fixtures. Anything outside that allowlist fails the
  # build.
  #
  # gitleaks is pinned by version + binary checksum for supply-chain
  # safety (same posture the `verify-wasm` / `verify-win-clipboard`
  # gates take for in-tree compiled artefacts). Bump GITLEAKS_VERSION
  # + GITLEAKS_SHA256 together when upgrading; the SHA is published
  # in the release notes at
  # https://github.com/gitleaks/gitleaks/releases.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit reachable
          # from the PR head, not just the latest tree. Catches the
          # case where a secret is added in commit N and removed in
          # commit N+1 within the same PR.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
          GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository for secrets
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose

  # Same supply-chain stance applied to the
  # `annot-win-clipboard` napi-rs addon at
  # `packages/desktop/native/win-clipboard/`. The committed
  # `prebuilds/win-clipboard.win32-x64.node` is the artefact
  # `electron-builder` ships in the Windows installer; CI rebuilds
  # from source on a `windows-latest` runner and diffs byte-for-byte
  # against the committed prebuild. A single byte of drift fails the
  # build — the same gate that catches a tampered `.wasm` here
  # catches a tampered `.node`.
  #
  # `windows-latest` is required because the addon links against
  # `windows::Win32::*` and produces an `x86_64-pc-windows-msvc` DLL.
  # No-op for PRs that don't touch the addon directory or this
  # workflow.
  verify-win-clipboard:
    name: verify win-clipboard addon
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Detect win-clipboard or workflow changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            win-clipboard:
              - 'packages/desktop/native/win-clipboard/**'
              - '.github/workflows/ci.yml'

      # No-arg `rustup toolchain install` reads the channel + targets
      # from the addon's rust-toolchain.toml. Byte-for-byte verify
      # only works against the exact compiler the committed prebuild
      # was built with — an unpinned `stable` broke the gate whenever
      # upstream shipped a new compiler.
      - name: Set up Rust + MSVC target (pinned via rust-toolchain.toml)
        if: steps.filter.outputs.win-clipboard == 'true'
        working-directory: packages/desktop/native/win-clipboard
        run: rustup toolchain install

      - name: Cache cargo registry + build
        if: steps.filter.outputs.win-clipboard == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/native/win-clipboard/target
          key: cargo-win-clipboard-${{ runner.os }}-${{ hashFiles('packages/desktop/native/win-clipboard/Cargo.lock', 'packages/desktop/native/win-clipboard/rust-toolchain.toml') }}
          restore-keys: |
            cargo-win-clipboard-${{ runner.os }}-

      - name: Verify committed prebuild matches a fresh build
        if: steps.filter.outputs.win-clipboard == 'true'
        shell: bash
        env:
          VERIFY_ADDON_OUT_DIR: ${{ runner.temp }}/win-clipboard-fresh
        run: bash packages/desktop/native/win-clipboard/scripts/verify-addon.sh

      # On failure, expose the fresh `.node` as a downloadable
      # artefact so the canonical CI build can be inspected — same
      # treatment `verify-wasm` gives the imagequant `pkg/` on
      # divergence.
      - name: Upload fresh prebuild on diff
        if: steps.filter.outputs.win-clipboard == 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: win-clipboard-fresh-prebuild
          path: ${{ runner.temp }}/win-clipboard-fresh
          if-no-files-found: error

      - name: Skip — no win-clipboard or workflow changes
        if: steps.filter.outputs.win-clipboard != 'true'
        shell: bash
        run: echo "No changes under packages/desktop/native/win-clipboard/ or this workflow; skipping."
