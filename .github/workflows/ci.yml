name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt JavaScript actions (checkout, setup-node, pnpm/action-setup) into
# the Node 24 runner ahead of GitHub's forced-switch on 2026-06-02.
# This only affects how those actions themselves run; the Node version
# used for our build is still set below via actions/setup-node.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      # Desktop is excluded from the build job: it runs `tauri build`,
      # which needs Rust + platform-specific Win32 APIs and is better
      # suited for a dedicated release workflow than a general CI check.
      - name: Build (core, web, extension)
        run: >
          pnpm
          --filter @ingcreators/annot-core
          --filter @ingcreators/annot-web
          --filter @ingcreators/annot-extension
          build

  # Run `pnpm audit` as a separate non-blocking job so findings surface
  # in the PR's check list without keeping the main typecheck/build
  # job waiting. `continue-on-error: true` means a new transitive
  # CVE doesn't stall merges while the team triages — GitHub's
  # native security advisory flow is our authoritative alert path,
  # and dependabot handles the actual upgrade PRs.
  security:
    name: security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high severity)
        run: pnpm audit --audit-level=high
