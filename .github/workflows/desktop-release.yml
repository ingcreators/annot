name: Desktop Release

# Builds platform installers for `@ingcreators/annot-desktop` via
# `electron-builder` on a Win / macOS / Linux matrix and uploads
# them to a GitHub Release.
#
# The macOS leg signs + notarizes when the `APPLE_*` + `CSC_*`
# secrets are present; absent secrets degrade gracefully to an
# unsigned `.dmg` so the workflow file itself stays runnable in
# forks. Linux is unsigned by default — AppImage / deb / rpm
# don't require code signing for end-user install.
#
# Triggers:
#   - push of a `release/desktop-*` tag (the standard release path)
#   - `workflow_dispatch` (manual run for ad-hoc release-candidate
#     builds, e.g. notarization smoke tests)
#
# History: queued behind Phase 9 of
# `docs/plans/_done/desktop-electron-migration.md` ("CI release
# pipeline" follow-up). The macOS notarization recipe in
# `packages/desktop/docs/notarization.md` is the manual
# counterpart this workflow automates.

on:
  push:
    tags:
      - "release/desktop-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. release/desktop-v0.2.0). Required for workflow_dispatch."
        required: true
        type: string

concurrency:
  # One release build per tag; cancel any in-flight earlier run if
  # the tag is re-pushed (rare but useful when iterating on the
  # workflow itself).
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the auto-provisioned GITHUB_TOKEN. The
# `publish` job overrides this with `contents: write` so
# `softprops/action-gh-release` can attach assets to the draft Release.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Don't cancel sibling matrix legs when one fails — a Linux
      # build failure shouldn't lose the parallel macOS notarized
      # output, especially since notarization can take 5–30 min.
      fail-fast: false
      matrix:
        include:
          # `electron-builder`'s default output dir (when no
          # `directories.output` override is set) is `dist/`
          # under the package directory, NOT `dist-electron/`.
          # The `dist-electron/` tree is the electron-vite
          # output (renderer + main + preload bundles).
          - os: ubuntu-latest
            artifact-glob: |
              packages/desktop/dist/*.AppImage
              packages/desktop/dist/*.deb
              packages/desktop/dist/*.rpm
          - os: macos-latest
            artifact-glob: |
              packages/desktop/dist/*.dmg
              packages/desktop/dist/*.zip
          - os: windows-latest
            artifact-glob: |
              packages/desktop/dist/*.exe
              packages/desktop/dist/*.msi

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Linux deb/rpm packaging needs `fakeroot` + `rpm`. Both ship
      # in the Ubuntu archive but aren't preinstalled on
      # `ubuntu-latest` runners.
      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      # The renderer + main + preload bundles are built first
      # (pure JS, runs on any OS). `electron-builder` then
      # consumes `dist-electron/` and packages it for the matrix
      # OS.
      - name: Build renderer + main + preload (electron-vite)
        run: pnpm --filter @ingcreators/annot-desktop build

      # ---- macOS: signing + notarization ----
      #
      # `electron-builder` reads the standard env-var triplet for
      # Developer-ID signing + notary submission:
      #   • CSC_LINK + CSC_KEY_PASSWORD: base64-encoded .p12
      #     Developer ID Application certificate + its passphrase.
      #     See `packages/desktop/docs/notarization.md` for the
      #     one-time export/encode recipe.
      #   • APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID:
      #     notary-service auth (app-specific password path).
      #     The API-key path uses APPLE_API_KEY / _ID / _ISSUER
      #     instead — `electron-builder` auto-detects which is set.
      #
      # `--publish never` is mandatory: `electron-builder` v26's
      # CI auto-detect would otherwise try to publish to GitHub
      # Releases without `GH_TOKEN`. The `publish` job below
      # handles that explicitly via `softprops/action-gh-release`.
      #
      # `CSC_LINK` is set conditionally — empty-string means
      # "no signing", but `electron-builder` mistakes it for a
      # path lookup (resolves to the project dir, errors with
      # "not a file"). So we only export it when the secret is
      # non-empty; the `${{ secrets.X || '' }}` default is just
      # for the env-var initialization order.
      - name: Package + sign + notarize (macOS)
        if: matrix.os == 'macos-latest'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          fi
          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "[release] notarization enabled (APPLE_TEAM_ID set)"
            pnpm --filter @ingcreators/annot-desktop exec electron-builder \
              --mac \
              --publish never \
              -c.mac.notarize.teamId="$APPLE_TEAM_ID"
          else
            echo "[release] APPLE_TEAM_ID unset — building unsigned dmg/zip"
            pnpm --filter @ingcreators/annot-desktop exec electron-builder --mac --publish never
          fi

      # ---- Linux: AppImage + deb + rpm ----
      #
      # Linux builds don't need code signing for end-user install
      # (the AppImage runs as a regular file; `apt`/`dnf` install
      # the deb/rpm with sudo). The `electron-builder` config in
      # `packages/desktop/package.json` already declares the three
      # targets + the runtime-library dependency lists; this just
      # invokes it.
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @ingcreators/annot-desktop exec electron-builder --linux --publish never

      # ---- Windows: NSIS installer + zip ----
      #
      # Windows code signing via `WIN_CSC_LINK` (base64-encoded
      # .pfx) + `WIN_CSC_KEY_PASSWORD`. Same gracefully-degrades
      # contract as macOS — secrets absent → unsigned installer
      # (Windows shows a SmartScreen warning on first install).
      # `CSC_LINK` is exported conditionally for the same reason
      # documented on the macOS step.
      - name: Package + sign (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            export CSC_LINK="$WIN_CSC_LINK"
            export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          fi
          pnpm --filter @ingcreators/annot-desktop exec electron-builder --win --publish never

      # ---- Smoke-boot the packaged app ----
      #
      # `electron-builder` emits installers AND an unpacked layout
      # next to them (`dist/<plat>-unpacked/`, plus `dist/mac-<arch>/
      # Annot.app` on macOS). Launching the unpacked binary
      # exercises the same module-parse + main-process boot the
      # end user hits when they double-click the installed app —
      # this catches the class of bug fixed in #459 (a bundler-
      # shim vs. source-level `__dirname` collision that surfaced
      # as a parse-time SyntaxError on first launch). Pre-#459 the
      # build leg "passed" because it only exercised
      # electron-builder's emit step — the runtime parse step never
      # ran in CI.
      #
      # Strategy: spawn the binary, wait HOLD_MS for it to either
      # crash on its own (= bundle-broken) or stay alive (= bundle
      # works), then SIGTERM it. A clean exit-0 within HOLD_MS is
      # also accepted (matches `--smoke-test` mode in `main.ts`,
      # which schedules `app.quit()` after window construction).
      # Everything else — non-zero early exit, spawn error — is a
      # boot failure.
      #
      # We deliberately do NOT depend on the app reaching
      # `app.quit()` cleanly to call the smoke step a pass.
      # Electron on a CI runner has enough quirks (renderer load
      # races, GPU init delay, no logged-in window-server session,
      # tray-icon init that holds the run-loop) that "process is
      # still alive after N seconds" is a more reliable
      # boot-survived signal than "exit code 0 within N seconds".
      #
      # Per-OS details:
      #   • Linux: runs under `xvfb-run` because the renderer still
      #     requires an X display even though the smoke step never
      #     interacts with it. `--no-sandbox` bypasses chromium's
      #     SUID-helper check (the unpacked `chrome-sandbox` would
      #     need `chown root + chmod 4755` to pass it; for a CI
      #     smoke we'd rather opt out than escalate privileges).
      #   • macOS: launches the inner Mach-O binary inside the
      #     `.app` bundle directly. `open -W -a Annot.app` returns
      #     the launch status, not the app's exit code, so we'd
      #     lose the signal we depend on.
      #   • Windows: launches the `.exe` directly. GUI subsystem
      #     stdout is detached, so `console.log` lines from the
      #     Electron main process won't appear in the runner log
      #     — that's fine, the exit code is still observable.
      - name: Smoke-boot packaged app
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_EXTRA_ARGS=""
          case "$RUNNER_OS" in
            Linux)
              SMOKE_PREFIX="xvfb-run -a "
              SMOKE_BINARY="packages/desktop/dist/linux-unpacked/annot"
              SMOKE_EXTRA_ARGS="--no-sandbox"
              ;;
            macOS)
              SMOKE_PREFIX=""
              # `mac-arm64/` on the current macos-latest runner;
              # glob covers the (unlikely) macos-x64 / macos-
              # universal switch without forcing a workflow edit.
              SMOKE_BINARY=$(ls -d packages/desktop/dist/mac*/Annot.app/Contents/MacOS/Annot 2>/dev/null | head -n1 || true)
              ;;
            Windows)
              SMOKE_PREFIX=""
              SMOKE_BINARY="packages/desktop/dist/win-unpacked/Annot.exe"
              ;;
            *)
              echo "[smoke] unknown RUNNER_OS=$RUNNER_OS" >&2
              exit 1
              ;;
          esac

          if [ -z "$SMOKE_BINARY" ] || [ ! -e "$SMOKE_BINARY" ]; then
            echo "[smoke] packaged binary not found at: '$SMOKE_BINARY'" >&2
            ls -la packages/desktop/dist/ || true
            exit 1
          fi

          echo "[smoke] launcher='${SMOKE_PREFIX}node' binary='$SMOKE_BINARY' extra='$SMOKE_EXTRA_ARGS'"
          SMOKE_BIN="$SMOKE_BINARY" SMOKE_EXTRA="$SMOKE_EXTRA_ARGS" ${SMOKE_PREFIX}node -e '
            const { spawn } = require("node:child_process");
            const bin = process.env.SMOKE_BIN;
            const HOLD_MS = 8000;
            const FORCE_KILL_GRACE_MS = 5000;
            const args = ["--smoke-test"];
            if (process.env.SMOKE_EXTRA) {
              for (const a of process.env.SMOKE_EXTRA.split(/\s+/)) if (a) args.push(a);
            }
            process.stdout.write("[smoke] spawn " + bin + " " + args.join(" ") + "\n");
            const child = spawn(bin, args, { stdio: "inherit" });
            let killedByUs = false;
            const tShutdown = setTimeout(() => {
              process.stdout.write("[smoke] " + (HOLD_MS/1000) + "s elapsed; app stayed alive — sending SIGTERM\n");
              killedByUs = true;
              child.kill("SIGTERM");
              setTimeout(() => {
                if (!child.killed) {
                  process.stdout.write("[smoke] SIGTERM did not take; SIGKILL\n");
                  child.kill("SIGKILL");
                }
              }, FORCE_KILL_GRACE_MS);
            }, HOLD_MS);
            child.on("error", (err) => {
              clearTimeout(tShutdown);
              process.stderr.write("[smoke] spawn error: " + err.message + "\n");
              process.exit(1);
            });
            child.on("exit", (code, signal) => {
              clearTimeout(tShutdown);
              if (killedByUs) {
                process.stdout.write("[smoke] PASS — app survived " + (HOLD_MS/1000) + "s then accepted shutdown (signal=" + signal + ")\n");
                process.exit(0);
              }
              if (code === 0) {
                process.stdout.write("[smoke] PASS — app exited cleanly (code=0) within hold window\n");
                process.exit(0);
              }
              process.stderr.write("[smoke] FAIL — app exited code=" + code + " signal=" + signal + " before " + (HOLD_MS/1000) + "s; bundle did not boot\n");
              process.exit(1);
            });
          '

      # Per-OS artifact upload. The artifact name carries the OS
      # so the Release-publish step downstream can grep them
      # apart. `if-no-files-found: error` catches a silent
      # electron-builder failure where the build "succeeds" but
      # emits no installer (typically a code-signing skip that
      # invalidated the output without erroring).
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 14

  # Aggregate the per-OS installers + attach to a GitHub Release.
  # Only fires on tag pushes (workflow_dispatch runs are RC builds
  # the maintainer downloads from artifact storage manually).
  publish:
    name: publish github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/release/desktop-')
    runs-on: ubuntu-latest
    permissions:
      contents: write # `softprops/action-gh-release` needs this
    steps:
      - uses: actions/checkout@v7

      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # The `release/desktop-vX.Y.Z` tag drives the release
          # title + tag-name in the GitHub UI. Body left blank
          # for the maintainer to fill in (manual changelog
          # curation is the right call until the desktop build
          # has its own release-notes generator).
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: artifacts/**/*
