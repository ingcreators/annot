name: Deploy

# Staged deploy for the four Cloudflare Workers on the `annot.work`
# zone. Every push to `main` (touching a deployable path) runs TWO
# stages in ONE job:
#
#   STAGING STAGE → deploy the four `*-staging` Workers on
#                   staging.annot.work, auto-apply migrations to the
#                   ISOLATED `annot-db-staging`, and smoke staging.
#   ── gate ──      Steps run sequentially; a failed step halts the
#                   job and SKIPS the prod stage. Production is never
#                   fronted by a build that didn't deploy + smoke
#                   cleanly on staging first (Phase 4 of
#                   docs/plans/staging-environment.md — closes the
#                   "ships straight to prod" audit gap).
#   PROD STAGE    → the prod D1 drift gate, then deploy the four
#                   production Workers on annot.work + smoke.
#
# Migrations:
#   - STAGING is AUTO-applied here — staging is where a bad migration
#     should fail, before it can reach prod.
#   - PROD stays operator-applied. The prod drift gate blocks the
#     prod stage until the migration is applied (locally via
#     `migrations:apply`, or the `apply-migrations.yml` workflow),
#     then re-dispatch. The staging stage re-runs idempotently.
#
# The four Workers are co-deployed product surfaces (the PWA calls
# API endpoints + reads schema the API expects); within each stage
# the API deploys before the PWA to minimise mismatched-window
# 404/500s.
#
# Secrets: `wrangler secret put` stays manual / operator-driven.
#
# IMPORTANT — the Cloudflare Workers Builds integration for `annot`
# / `annot-api` MUST stay disabled in the dashboard (Workers & Pages
# → … → Settings → Builds → Disconnect), else Cloudflare watches
# GitHub itself, races this workflow, and defeats the staging gate.
# (The standalone `deploy-staging.yml` is a manual, on-demand staging
# deploy from any ref — complementary to this auto staging→prod flow.
# Don't run it concurrently with a deploy here; both target the same
# staging Workers.)

on:
  push:
    branches: [main]
    # GitHub Actions only permits ONE of `paths` / `paths-ignore`
    # per event, so the exclusions below use negation patterns
    # (`!path`) within the single `paths` list. Patterns are
    # applied in order: a later `!` exclusion strips a path that
    # an earlier positive pattern would have matched.
    paths:
      # ─── Include ───────────────────────────────────────────
      # Workspace package source — any package change can
      # affect any of the deployed bundles. The negations
      # below trim back the demonstrably-non-deployable subsets.
      - "packages/**"
      # Root config that defines the PWA worker.
      - "wrangler.jsonc"
      # Lockfile bumps can change any bundle.
      - "pnpm-lock.yaml"
      # Allow operator iteration on the deploy pipeline itself.
      - ".github/workflows/deploy.yml"

      # ─── Exclude ───────────────────────────────────────────
      # Docs / READMEs across the repo.
      - "!**/*.md"
      # Schema files are operator-applied via `migrations:apply`,
      # not code-deployed.
      - "!packages/worker/migrations/**"
      # Tests / test helpers don't ship in either bundle.
      - "!packages/**/*.test.ts"
      - "!packages/**/*.test-helpers.ts"
      - "!packages/**/*.test-mock.ts"
      - "!packages/**/*.contract.test.ts"
      # Storybook doesn't ship to production.
      - "!packages/**/*.stories.ts"
      - "!packages/web/.storybook/**"

      # ─── Re-include ────────────────────────────────────────
      # The Astro Starlight docs site's CONTENT is `.mdx` (not
      # in scope of `!**/*.md`) — but a docs-tour run that
      # rewrites the snapshot blocks of an existing MDX would
      # otherwise be hidden. Explicit re-include for clarity.
      - "packages/docs-site/src/content/docs/**/*.mdx"
  workflow_dispatch:

# Serialise deploys. `cancel-in-progress: true` lets a newer
# push abandon an older still-running deploy; the newer push's
# output would have overwritten the older one anyway, so
# cancelling saves runner minutes without changing final state.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: deploy staging → prod (annot.work)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        run: pnpm --filter @ingcreators/annot-worker typecheck

      # Build every static-asset bundle ONCE — the same artefacts
      # deploy to both staging and prod (staging mirrors prod). Built
      # before either stage so a build failure stops everything
      # before any deploy. turbo dedupes the shared work.
      # `VITE_GOOGLE_*` are Vite build-time env — inlined into the
      # PWA bundle so the client-side Google Drive integration
      # (`google-auth.ts` → GIS `initTokenClient` + Picker) has a
      # client id + API key. Without them the bundle ships an empty
      # `client_id` and Drive connect throws "Missing required
      # parameter client_id." They're public values (visible in the
      # shipped JS); kept as secrets here only for config-management
      # convenience. The same build feeds staging + prod.
      - name: Build annot (PWA), annot-marketing, annot-docs-site (Astro Starlight)
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
        run: >
          pnpm
          --filter @ingcreators/annot-core
          --filter @ingcreators/annot-web
          --filter @ingcreators/annot-marketing
          --filter @ingcreators/annot-docs-site
          build

      # ══════════════════════ STAGING STAGE ══════════════════════
      # Deploy + migrate + smoke staging.annot.work. Any failure
      # below halts the job before the PROD STAGE runs.

      - name: (staging) Deploy annot-api-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ingcreators/annot-worker exec wrangler deploy --env staging

      # Auto-apply to the ISOLATED staging D1. If a migration is bad
      # it fails HERE (staging), never on prod. Idempotent — a
      # re-dispatch skips already-applied migrations.
      - name: (staging) Apply D1 migrations to annot-db-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm --filter @ingcreators/annot-worker exec
          wrangler d1 migrations apply annot-db-staging --remote --env staging

      - name: (staging) Deploy annot-staging (PWA)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging

      - name: (staging) Deploy annot-marketing-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ingcreators/annot-marketing exec wrangler deploy --env staging

      - name: (staging) Deploy annot-docs-site-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ingcreators/annot-docs-site exec wrangler deploy --env staging

      - name: (staging) Smoke check staging.annot.work
        run: |
          set -euo pipefail
          for i in {1..6}; do
            if curl -sf --max-time 5 https://staging.annot.work/api/health/bindings \
                 | tee /tmp/staging-health.json | grep -q '"ok":true'; then
              echo "staging API bindings ok:"; cat /tmp/staging-health.json; break
            fi
            [ "$i" -eq 6 ] && { echo "::error::staging API smoke failed"; cat /tmp/staging-health.json || true; exit 1; }
            echo "  attempt $i failed; retrying in 5s…"; sleep 5
          done
          for url in \
            "https://staging.annot.work/" \
            "https://staging.annot.work/app/" \
            "https://staging.annot.work/docs/"; do
            if curl -sfI --max-time 5 "$url" | grep -qE "^HTTP/.* (200|301|302)"; then
              echo "✓ $url"
            else
              echo "::error::staging static smoke failed for $url"; exit 1
            fi
          done

      # ══════════ gate: staging green → promote to prod ══════════
      - name: Gate — staging is green, promoting to production
        run: echo "Staging deployed + smoked clean. Proceeding to the production stage."

      # ══════════════════════ PROD STAGE ═════════════════════════

      # Prod D1 drift guard. Unlike staging (auto-applied above), a
      # pending PROD migration BLOCKS this stage — the operator
      # applies it deliberately (staging has already proven the SQL
      # applies), then re-dispatches.
      - name: (prod) Check for pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd packages/worker
          output=$(pnpm exec wrangler d1 migrations list annot-db --remote 2>&1 || true)
          echo "── wrangler d1 migrations list output ──"
          echo "$output"
          echo "─────────────────────────────────────────"
          if echo "$output" | grep -qE "[0-9]{4}_[A-Za-z0-9_-]+\.sql"; then
            {
              echo "::error::Pending PROD D1 migrations detected — the prod stage is blocked."
              echo "::error::Staging already applied + validated them; now apply to prod via EITHER:"
              echo "::error::  - Actions UI: run 'Apply D1 migrations' (apply-migrations.yml), dry_run off."
              echo "::error::  - Locally: pnpm --filter @ingcreators/annot-worker migrations:apply"
              echo "::error::then re-dispatch this deploy. Staging re-runs idempotently."
            } 1>&2
            exit 1
          fi
          echo "✓ Prod D1 schema is up to date — proceeding with the prod deploy."

      # API ships before PWA so the endpoints the new PWA bundle
      # calls are already live.
      - name: (prod) Deploy annot-api
        env:
          # Cloudflare API token scopes (Account unless noted):
          #   Workers Scripts:Edit, Workers R2 Storage:Edit,
          #   Workers KV Storage:Edit, D1:Edit,
          #   Workers Observability:Edit, Workers Tail:Read,
          #   Account Settings:Read, Zone Workers Routes:Edit
          #   (annot.work), User Details:Read + Memberships:Read.
          # Account-level D1/KV/R2 scopes also cover the *-staging
          # resources, so the same token drives both stages.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ingcreators/annot-worker cf:deploy

      - name: (prod) Smoke check /api/health/bindings
        run: |
          set -euo pipefail
          for i in {1..6}; do
            if curl -sf --max-time 5 https://annot.work/api/health/bindings | tee /tmp/health.json | grep -q '"ok":true'; then
              echo "API smoke check passed:"; cat /tmp/health.json; exit 0
            fi
            echo "Attempt $i failed; retrying in 5s…"; sleep 5
          done
          echo "API smoke check failed after 30s. Last body:"
          cat /tmp/health.json || echo "(no body)"
          exit 1

      - name: (prod) Deploy annot (PWA)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: (prod) Deploy annot-marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ingcreators/annot-marketing cf:deploy

      # Legacy VitePress Worker still holds the annot.work/docs route
      # claim on Cloudflare; delete it before the Astro worker claims
      # the route. `continue-on-error` — idempotent only on the first
      # run, a no-op advisory afterwards.
      - name: (prod) Delete legacy annot-docs-site Worker (one-time)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler delete --name annot-docs-site --force

      - name: (prod) Deploy annot-docs-site (Astro Starlight)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @ingcreators/annot-docs-site cf:deploy

      - name: (prod) Smoke check annot.work surfaces
        run: |
          set -euo pipefail
          smoke() {
            local url="$1"
            local label="$2"
            for i in {1..6}; do
              if curl -sfI --max-time 5 "$url" | grep -qE "^HTTP/.* 200"; then
                echo "✓ $label → 200"
                return 0
              fi
              echo "  Attempt $i for $label failed; retrying in 5s…"
              sleep 5
            done
            echo "::error::$label smoke check failed after 30s ($url)"
            return 1
          }
          smoke "https://annot.work/" "marketing landing"
          smoke "https://annot.work/app/" "PWA"
          smoke "https://annot.work/docs/" "docs site (Astro Starlight)"
