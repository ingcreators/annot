name: Docs dogfood tour

# Phase 5 of `docs/plans/annot-work-astro-unification.md`.
#
# Runs the Playwright tour that captures live screens of the
# Annot web app at `annot.work/app/` and re-syncs the matching
# `<Screen>` + `<Overlay match>` MDX blocks in
# `packages/docs-site-astro/src/content/docs/app/`. Phase 5
# scope is the proof-of-concept `app/index.mdx` page; the tour
# expands to the remaining /docs/app/* + screenshot-heavy
# getting-started / recipes pages as follow-up PRs.
#
# Trigger model:
#   - Nightly so a UI change that lands without a docs-touching
#     PR still gets caught.
#   - On PRs that touch `packages/web/**` so the author sees the
#     resulting drift before merge.
#   - Manual dispatch for ad-hoc reruns.
#
# **Failures are advisory.** The tour can fail for transient
# reasons (Cloudflare edge propagation, network jitter, a
# locator that briefly didn't resolve). `continue-on-error:
# true` keeps the PR check status green and writes any drift as
# a warning annotation on the PR diff via the bundled
# annotate-pr.js helper. The first 2-3 release cycles after
# Phase 5 lands are observation; once the tour stays stable,
# promote `continue-on-error` to `false`.

on:
  schedule:
    - cron: "0 18 * * *" # nightly 18:00 UTC ≈ 03:00 JST
  pull_request:
    paths:
      - "packages/web/**"
      - "packages/docs-site-astro/tests/docs/**"
      - "packages/docs-site-astro/src/content/docs/app/**"
      - ".github/workflows/docs-tour.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # for annotate-pr.js

concurrency:
  group: docs-tour-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tour:
    name: capture + re-sync /docs/app/* screens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # advisory in Phase 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @ingcreators/annot-docs-site-astro exec playwright install chromium

      - name: Run the dogfood tour
        env:
          ANNOT_APP_URL: https://annot.work/app/
        run: pnpm --filter @ingcreators/annot-docs-site-astro docs:tour

      - name: Surface MDX diff
        if: always()
        run: |
          set +e
          git diff --stat packages/docs-site-astro/src/content/docs/app/ > /tmp/diff-stat.txt
          if [ -s /tmp/diff-stat.txt ]; then
            echo "::notice::Docs tour rewrote MDX snapshot blocks:"
            cat /tmp/diff-stat.txt
            echo ""
            echo "Open the PR / nightly artifact's git-diff to inspect changes."
          else
            echo "::notice::Docs tour completed; no MDX rewrites (UI matched stored snapshot)."
          fi
