name: Docs dogfood tour

# Phase 5 of `docs/plans/_done/annot-work-astro-unification.md`.
#
# Runs the Playwright tour that captures live screens of the
# Annot web app at `annot.work/app/` and re-syncs the matching
# `<Screen>` + `<Overlay match>` MDX blocks in
# `packages/docs-site/src/content/docs/app/`. The tour produces
# TWO kinds of output:
#
#   1. The base screenshot PNG, written to
#      `packages/docs-site/public/app/shots/<id>.png` so Astro
#      serves it under `/docs/app/shots/<id>.png` at build time.
#   2. The MDX `annot:snapshot` + `annot:attributes` comment
#      blocks, rewritten in place via the byte-stable
#      `screen.capture()` helper.
#
# Trigger model:
#   - Nightly so a UI change that lands without a docs-touching
#     PR still gets caught.
#   - On PRs that touch `packages/web/**` so the author sees the
#     resulting drift before merge.
#   - Manual dispatch for ad-hoc reruns.
#
# **Propagation: auto-PR.** The tour runs in an ephemeral CI
# runner — file modifications stay in the runner unless we
# push them back to the repo. On `schedule` and
# `workflow_dispatch` runs we open a PR with the rewritten
# files (placeholder PNG → live screenshot + refreshed
# snapshot blocks). On `pull_request` runs we skip the PR
# step — the tour acts as drift detection only, surfacing any
# rewrites as a workflow annotation for the PR author to act
# on manually.
#
# **Token: GitHub App, not GITHUB_TOKEN.** Auto-PRs created
# with the default `GITHUB_TOKEN` don't trigger downstream
# CI workflows (GitHub's anti-recursion guard) — the PR would
# need a manual close+reopen to fire `ci.yml`. Using a token
# minted by the `annot-docs-tour` GitHub App via
# `actions/create-github-app-token` produces a PR authored
# by the App's bot identity, which triggers CI normally.
# App ID + private key live in repo secrets
# `DOCS_TOUR_APP_ID` + `DOCS_TOUR_APP_PRIVATE_KEY`.
#
# **Tour failures are advisory** in Phase 5
# (`continue-on-error: true`). Promotes to blocking once the
# tour stays stable across 2-3 release cycles.

on:
  schedule:
    - cron: "0 18 * * *" # nightly 18:00 UTC ≈ 03:00 JST
  pull_request:
    paths:
      - "packages/web/**"
      - "packages/docs-site/tests/docs/**"
      - "packages/docs-site/src/content/docs/app/**"
      - ".github/workflows/docs-tour.yml"
  workflow_dispatch:

permissions:
  # The auto-PR step uses an App installation token (minted by
  # actions/create-github-app-token), not GITHUB_TOKEN, so we
  # don't need contents/pull-requests write here. Workflow-
  # annotation writes (the "Surface MDX diff" step's
  # `::notice::` lines) require nothing extra.
  contents: read

concurrency:
  group: docs-tour-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tour:
    name: capture + re-sync /docs/app/* screens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # advisory in Phase 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @ingcreators/annot-docs-site exec playwright install chromium

      - name: Run the dogfood tour
        env:
          ANNOT_APP_URL: https://annot.work/app/
        run: pnpm --filter @ingcreators/annot-docs-site docs:tour

      - name: Surface MDX diff
        if: always()
        id: diff
        run: |
          set +e
          git add -N packages/docs-site/public/app/shots/ packages/docs-site/src/content/docs/app/ 2>/dev/null
          if [ -n "$(git diff --stat HEAD -- packages/docs-site/public/app/shots/ packages/docs-site/src/content/docs/app/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs tour rewrote files:"
            git diff --stat HEAD -- packages/docs-site/public/app/shots/ packages/docs-site/src/content/docs/app/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs tour completed; no file rewrites (UI matched stored snapshot)."
          fi

      # ── Mint a GitHub App installation token ─────────────────
      # The token below is what the auto-PR step uses. Default
      # GITHUB_TOKEN-authored PRs don't trigger downstream CI
      # workflows; App-authored ones do (the App is a distinct
      # identity, not the workflow itself).
      - name: Generate App installation token
        if: |
          steps.diff.outputs.changed == 'true'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DOCS_TOUR_APP_ID }}
          private-key: ${{ secrets.DOCS_TOUR_APP_PRIVATE_KEY }}

      # ── Auto-PR on scheduled + manual runs ───────────────────
      # `pull_request`-triggered runs skip this — those runs are
      # drift detection only, surfacing rewrites as an annotation
      # that the PR author resolves manually.
      - name: Open PR with rewritten screenshots + snapshot blocks
        if: |
          steps.diff.outputs.changed == 'true'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: |
            chore(docs-tour): refresh /docs/app/* screenshots + snapshot blocks

            Auto-generated by `.github/workflows/docs-tour.yml` after a
            scheduled or manual tour run. Drift was detected against
            the live `annot.work/app/` UI; this PR carries the
            rewritten base screenshot PNG(s) + the refreshed MDX
            `annot:snapshot` / `annot:attributes` comment blocks.
            Review the diff to confirm the live UI is what the docs
            should show, then squash-merge.
          title: "chore(docs-tour): refresh /docs/app/* screenshots + snapshot blocks"
          body: |
            ## Auto-generated by the docs-tour workflow

            The scheduled / manually-triggered docs-tour run detected
            drift against `annot.work/app/` and rewrote:

            - Base screenshot PNG(s) under
              `packages/docs-site/public/app/shots/`
            - MDX `annot:snapshot` + `annot:attributes` comment
              blocks under `packages/docs-site/src/content/docs/app/`

            Review the diff. If the live UI is the intended state,
            squash-merge — the next production deploy pushes the
            refreshed screenshots to `annot.work/docs/app/`.

            If the live UI changed unintentionally, fix the app
            first, then re-run the tour (or close this PR; the
            placeholder stays in production).
          branch: chore/docs-tour-refresh
          delete-branch: true
          base: main
          labels: |
            docs
            docs-tour
