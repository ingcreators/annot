name: Publish

# Manually-triggered publish of the three OSS npm packages —
# `@ingcreators/annot-core`, `@ingcreators/annot-annotator`,
# `@ingcreators/annot-playwright` — via Changesets, authenticated
# via npm Trusted Publishing (OIDC).
#
# Phase 6 of `docs/plans/annot-cloud-roadmap.md` / Stage 3 of
# `docs/plans/headless-annotator-publish.md`. The first run after
# this workflow lands is the very first npm publish from this
# org; treat each manual dispatch as a deliberate release event.
#
# Trust model:
#   - `workflow_dispatch` only. NEVER auto-publishes on push.
#     Versions move when the operator clicks "Run workflow", and
#     the operator's clicks ARE the release signal.
#   - The operator decides what's publishable by running
#     `pnpm changeset version` locally + merging the resulting
#     version-bump PR BEFORE dispatching this workflow. Until
#     a changeset is materialised into a version bump, this
#     workflow has nothing to publish (`changeset publish` is a
#     no-op when no pending versions exist).
#   - Re-running against the same `main` SHA is safe: the
#     `changeset publish` step skips packages whose `version`
#     already matches what's on the registry, so a re-dispatch
#     after a partial-failure recovery doesn't double-publish.
#
# Auth: Trusted Publishing (OIDC). No long-lived `NPM_TOKEN`
# secret needed — GitHub Actions mints a short-lived OIDC
# identity token via `permissions: id-token: write`, npm verifies
# it against the configured Trusted Publisher rules
# (repo + workflow path + ref), and grants publish on a per-run
# basis. Token never touches the runner's disk.
#
# Required setup on npmjs.com (one-time, per package OR at the
# org level so it covers all current + future packages):
#
#   1. https://www.npmjs.com/settings/ingcreators/trusted-publishers
#      (Org-level setup applies to every `@ingcreators/*` package,
#      current and future.)
#   2. "Add new publisher" → GitHub Actions:
#        - Organization: `ingcreators`
#        - Repository:   `annot`
#        - Workflow:     `.github/workflows/publish.yml`
#        - Environment:  (leave empty)
#   3. Save. Done.
#
# OIDC requires npm CLI v11.5.1+; the "Upgrade npm CLI" step
# below ensures that even on Node 24's bundled npm 10.x runner.
#
# This workflow does NOT:
#   - Bump versions. `pnpm changeset version` is operator-run
#     locally; the version-bump commit lands as its own PR.
#   - Build a static-assets PWA / desktop installer / VSCode
#     extension. Those have their own deploy stories.
#   - Touch `private: true` packages (Changesets' `ignore` list
#     hides them; `changeset publish` skips them regardless).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run `changeset publish --dry-run` (don't actually publish)"
        type: boolean
        default: false

# One publish at a time. Cancelling an in-flight publish is
# dangerous — `changeset publish` makes one npm registry call per
# package, and a half-completed run can leave some packages on
# the new version and others on the old. Keep `cancel-in-progress:
# false` so a second dispatch queues rather than aborts.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted Publishing — GitHub Actions mints a short-lived
      # OIDC identity token on the runner; the npm CLI presents
      # it to npmjs.org to authenticate the publish. No secret
      # storage involved. Without this permission, npm falls
      # back to looking for `NODE_AUTH_TOKEN`, which we don't
      # provide — so the publish hard-errors instead of silently
      # using stale auth. That's the safer failure mode.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # `registry-url` is intentionally omitted — under
          # Trusted Publishing the OIDC token is the auth, not
          # a `_authToken` in `~/.npmrc`. Setting registry-url
          # here would write an empty auth line, which npm
          # interprets as "anonymous" and is harmless but noisy.

      - name: Upgrade npm CLI to OIDC-supporting version
        # Node 24 ships with npm 10.x; Trusted Publishing needs
        # 11.5.1+. Installing globally + verifying the version
        # makes future Node bumps a no-op (the check will pass
        # earlier).
        run: |
          set -euo pipefail
          npm install --global npm@latest
          npm --version
          # Print npm CLI version so the log shows the OIDC-
          # capable version was installed.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the publishable packages first so `dist/` is fresh.
      # We pin the three filter targets explicitly rather than
      # `pnpm -r build` to avoid time spent on the host apps
      # (web / extension / desktop) that aren't publishing.
      - name: Build publishable packages
        run: >
          pnpm
          --filter @ingcreators/annot-core
          --filter @ingcreators/annot-annotator
          --filter @ingcreators/annot-playwright
          build

      # Sanity: `pnpm pack` round-trip catches `files` allowlist
      # mistakes BEFORE the npm registry sees a malformed tarball.
      # We `pack --dry-run` and just inspect the output; the
      # actual `publish` step packs again internally.
      - name: Verify pack contents
        run: |
          set -euo pipefail
          for pkg in core annotator playwright; do
            echo "── @ingcreators/annot-${pkg} pack contents ──"
            pnpm --filter @ingcreators/annot-${pkg} pack --pack-destination /tmp --dry-run 2>&1 \
              | grep -v "^[[:space:]]*$" || true
            echo ""
          done

      - name: Publish via Changesets
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "── DRY RUN: changeset publish --dry-run ──"
            pnpm changeset publish --dry-run
          else
            pnpm changeset publish
          fi

      # Show a recap so the operator can paste the published
      # version + tarball URLs into the announcement / Slack /
      # release notes without trawling the log.
      - name: Recap
        if: success() && inputs.dry-run != true
        run: |
          set -euo pipefail
          for pkg in core annotator playwright; do
            v=$(node -p "require('./packages/${pkg}/package.json').version")
            echo "✓ @ingcreators/annot-${pkg}@${v} → https://www.npmjs.com/package/@ingcreators/annot-${pkg}/v/${v}"
          done
