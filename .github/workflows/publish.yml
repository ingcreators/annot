name: Publish

# Manually-triggered publish of the OSS npm packages —
# `@ingcreators/annot-core`, `@ingcreators/annot-annotator`,
# `@ingcreators/annot-playwright`, `@ingcreators/annot-mcp`,
# `@ingcreators/annot-product-docs`,
# `@ingcreators/annot-product-docs-astro`,
# `@ingcreators/annot-product-docs-xlsx` — via Changesets.
#
# Note: `@ingcreators/annot-imagequant` was published at 0.1.0
# and then retired by `replace-libimagequant-with-median-cut.md`;
# its package directory is gone from the workspace and this
# workflow no longer references it.
#
# Phase 6 of `docs/plans/annot-cloud-roadmap.md` / Stage 3 of
# `docs/plans/_done/headless-annotator-publish.md`. The first run after
# this workflow lands is the very first npm publish from this
# org; treat each manual dispatch as a deliberate release event.
#
# ## Trust model
#
#   - `workflow_dispatch` only. NEVER auto-publishes on push.
#     Versions move when the operator clicks "Run workflow", and
#     the operator's clicks ARE the release signal.
#   - The operator decides what's publishable by running
#     `pnpm changeset version` locally + merging the resulting
#     version-bump PR BEFORE dispatching this workflow. Until
#     a changeset is materialised into a version bump, this
#     workflow has nothing to publish (`changeset publish` is a
#     no-op when no pending versions exist).
#   - Re-running against the same `main` SHA is safe: the
#     `changeset publish` step skips packages whose `version`
#     already matches what's on the registry, so a re-dispatch
#     after a partial-failure recovery doesn't double-publish.
#
# ## Auth: dual-mode (Trusted Publishing OR NPM_TOKEN)
#
# This workflow supports BOTH npm Trusted Publishing (OIDC) and
# legacy `NPM_TOKEN`-based auth. The two modes coexist because
# npm's Trusted Publishing UI is currently **per-package** and
# **post-publish only** — the first publish of a NEW package has
# to use a token to create it on the registry, after which the
# operator configures Trusted Publishers on the package's own
# Settings page and the token can be retired.
#
# Bootstrap timeline:
#
#   Step 1. First publish (bootstrap):
#     - Operator creates a short-lived Granular Access Token
#       (1-week TTL) scoped to `@ingcreators` with publish perms.
#     - Sets `NPM_TOKEN` repo secret to the token.
#     - Dispatches this workflow. The three packages get created
#       on npm.
#
#   Step 2. Per-package Trusted Publisher setup:
#     - For each of the now-existing packages, the operator
#       navigates to:
#         https://www.npmjs.com/package/@ingcreators/annot-core/access
#         https://www.npmjs.com/package/@ingcreators/annot-annotator/access
#         https://www.npmjs.com/package/@ingcreators/annot-playwright/access
#         https://www.npmjs.com/package/@ingcreators/annot-mcp/access
#         https://www.npmjs.com/package/@ingcreators/annot-product-docs/access
#         https://www.npmjs.com/package/@ingcreators/annot-product-docs-astro/access
#         https://www.npmjs.com/package/@ingcreators/annot-product-docs-xlsx/access
#       (or per-package Settings → "Trusted Publishers")
#     - Adds a Trusted Publisher rule:
#         Publisher: GitHub Actions
#         Organization: ingcreators
#         Repository:   annot
#         Workflow:     .github/workflows/publish.yml
#         Environment:  (leave empty)
#
#   Step 3. Retire the token:
#     - Operator deletes the `NPM_TOKEN` repo secret.
#     - Operator deletes the Granular Access Token from npm.com.
#     - Future publishes use OIDC automatically.
#
# How auth selection works in this workflow:
#
#   - `permissions: id-token: write` is always set, so OIDC is
#     ALWAYS available.
#   - If `NPM_TOKEN` is set, npm CLI uses it (legacy auth path).
#   - If `NPM_TOKEN` is empty / unset, npm CLI falls back to
#     OIDC and looks for the Trusted Publisher rule on each
#     package being published.
#
# OIDC requires npm CLI v11.5.1+; the "Upgrade npm CLI" step
# below ensures that even on Node 24's bundled npm 10.x runner.
#
# ## This workflow does NOT
#
#   - Bump versions. `pnpm changeset version` is operator-run
#     locally; the version-bump commit lands as its own PR.
#   - Build a static-assets PWA / desktop installer / VSCode
#     extension. Those have their own deploy stories.
#   - Touch `private: true` packages (Changesets' `ignore` list
#     hides them; `changeset publish` skips them regardless).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run `changeset publish --dry-run` (don't actually publish)"
        type: boolean
        default: false

# One publish at a time. Cancelling an in-flight publish is
# dangerous — `changeset publish` makes one npm registry call per
# package, and a half-completed run can leave some packages on
# the new version and others on the old. Keep `cancel-in-progress:
# false` so a second dispatch queues rather than aborts.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for OIDC Trusted Publishing. Even when we use a
      # token in the bootstrap window, leaving this on costs
      # nothing — the runner just doesn't request an OIDC token
      # if npm CLI doesn't need one.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # Writes `~/.npmrc` with the registry URL. In token
          # mode, the auth token is also written by the env-var
          # interpolation `${NODE_AUTH_TOKEN}`; in OIDC mode,
          # this just establishes the registry endpoint and
          # npm CLI ignores the (empty) auth line.
          registry-url: "https://registry.npmjs.org"
          scope: "@ingcreators"

      - name: Upgrade npm CLI to OIDC-supporting version
        # Node 24 ships with npm 10.x; Trusted Publishing needs
        # 11.5.1+. Token auth works on any version, but we install
        # the latest anyway so the same job handles both modes.
        run: |
          set -euo pipefail
          npm install --global npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the publishable packages first so `dist/` is fresh.
      # We pin the filter targets explicitly rather than
      # `pnpm -r build` to avoid time spent on the host apps
      # (web / extension / desktop) that aren't publishing.
      - name: Build publishable packages
        run: >
          pnpm
          --filter @ingcreators/annot-core
          --filter @ingcreators/annot-annotator
          --filter @ingcreators/annot-playwright
          --filter @ingcreators/annot-mcp
          build

      # Sanity: `pnpm pack` round-trip catches `files` allowlist
      # mistakes BEFORE the npm registry sees a malformed tarball.
      # We `pack --dry-run` and just inspect the output; the
      # actual `publish` step packs again internally.
      - name: Verify pack contents
        run: |
          set -euo pipefail
          for pkg in core annotator playwright mcp product-docs product-docs-astro product-docs-xlsx; do
            echo "── @ingcreators/annot-${pkg} pack contents ──"
            pnpm --filter @ingcreators/annot-${pkg} pack --pack-destination /tmp --dry-run 2>&1 \
              | grep -v "^[[:space:]]*$" || true
            echo ""
          done

      - name: Report auth mode
        # Helps the operator confirm which auth path the publish
        # took. Doesn't leak the token (just reports whether one
        # is set).
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Auth: NPM_TOKEN (bootstrap mode)"
          else
            echo "Auth: OIDC (Trusted Publishing)"
          fi

      - name: Publish to npm
        env:
          # When NPM_TOKEN is set, npm CLI uses it. When unset
          # (empty string from a missing secret), npm CLI falls
          # back to OIDC. Both env-var names are checked by
          # different npm CLI codepaths; setting both is safe.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            # `changeset publish` has no `--dry-run` flag; use
            # pnpm's recursive publish in dry-run mode for the
            # same effect (validates auth + tarball shape against
            # the registry without committing). pnpm walks the
            # workspace and skips `private: true` packages
            # automatically.
            #
            # `--no-git-checks` because CI runners often have a
            # dirty tree from auto-generated build artefacts,
            # which would otherwise fail pnpm's pre-publish gate.
            echo "── DRY RUN: pnpm publish -r --dry-run ──"
            pnpm publish -r --dry-run --access public --no-git-checks
          else
            # Real publish goes through Changesets so dependent
            # packages publish in the correct order (annot-core
            # → annot-annotator → annot-playwright).
            pnpm changeset publish
          fi

      # Show a recap so the operator can paste the published
      # version + tarball URLs into the announcement / Slack /
      # release notes without trawling the log.
      - name: Recap
        if: success() && inputs.dry-run != true
        run: |
          set -euo pipefail
          for pkg in core annotator playwright mcp product-docs product-docs-astro product-docs-xlsx; do
            v=$(node -p "require('./packages/${pkg}/package.json').version")
            echo "✓ @ingcreators/annot-${pkg}@${v} → https://www.npmjs.com/package/@ingcreators/annot-${pkg}/v/${v}"
          done
