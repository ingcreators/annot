version: 2

# Keep dependency churn low on a two-person repo: grouped PRs, weekly
# cadence for npm, monthly for GitHub Actions (infrastructure moves
# slower). Security advisories bypass the groups and land immediately
# as individual PRs — that's the behaviour we actually want to wake up
# for. Major-version updates also come as individual PRs since they
# usually need attention.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Hold back majors that need a planned migration rather than a
    # drive-by upgrade. Dependabot still opens minor / patch bumps
    # and security advisories; only untriaged major-version PRs are
    # suppressed.
    #   - vitest@5+    — mocking / hooks API tends to shift; msw +
    #                    happy-dom + fake-indexeddb rigs want
    #                    re-validated as a set.
    #   - vite@9+      — PWA plugin + worker inputs moved between
    #                    7/8; future majors deserve the same
    #                    service-worker precache + handoff-route
    #                    pass we did for 8.
    # (biome was previously here for the 1 → 2 migration that landed
    #  in #57; dropped now that the config is on the 2.x schema and
    #  opinionated new rules are explicitly triaged.)
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Monthly runs on the first working day of the month; Dependabot
      # rejects `day:` values that aren't weekday names (monday–sunday),
      # so we leave it off entirely rather than pin it.
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
